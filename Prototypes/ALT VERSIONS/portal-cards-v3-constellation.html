<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IHE — The Constellation</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Azeret+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#060610;--card:rgba(10,10,22,0.88);--border:rgba(255,255,255,0.05)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Bricolage Grotesque',sans-serif;color:#fff;height:100vh;overflow:auto;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,229,255,0.025) 0%,transparent 50%);pointer-events:none;z-index:0}

/* Topbar */
.topbar{position:fixed;top:0;left:0;right:0;height:48px;background:rgba(6,6,16,0.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}
.brand{font-weight:800;font-size:15px}
.brand em{font-style:normal;background:linear-gradient(90deg,#00e5ff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar button{padding:6px 14px;background:rgba(0,229,255,0.04);border:1px solid rgba(0,229,255,0.08);border-radius:6px;color:rgba(0,229,255,0.5);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}

/* Layout */
.page{padding:64px 16px 40px;min-height:100vh;display:flex;flex-direction:column;align-items:center;z-index:1;position:relative}

/* SVG beams layer */
.beams-layer{position:fixed;inset:0;z-index:2;pointer-events:none}

/* Chat hub - centered */
.hub{width:100%;max-width:520px;margin:16px auto 24px;text-align:center;z-index:10;position:relative}
.hub h1{font-size:22px;font-weight:800;letter-spacing:-0.8px;margin-bottom:4px}
.hub h1 em{font-style:normal;background:linear-gradient(90deg,#00e5ff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hub .sub{font-size:12px;color:rgba(255,255,255,0.25);margin-bottom:14px;font-family:'Azeret Mono',monospace}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border:1px solid rgba(0,229,255,0.08);border-radius:14px;backdrop-filter:blur(20px);box-shadow:0 0 40px rgba(0,229,255,0.03)}
.bar:focus-within{border-color:rgba(0,229,255,0.2)}
.orb{width:36px;height:36px;border-radius:50%;background:conic-gradient(from 0deg,#00e5ff,#00ff88,#00e5ff);animation:sp 4s linear infinite;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 16px rgba(0,229,255,0.2)}
.orb i{width:30px;height:30px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;font-style:normal}
@keyframes sp{to{transform:rotate(360deg)}}
.bar input{flex:1;background:none;border:none;outline:none;color:#fff;font-family:'Bricolage Grotesque';font-size:14px;padding:6px}
.bar input::placeholder{color:rgba(255,255,255,0.15)}
.bar button{width:32px;height:32px;border-radius:8px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.bs{background:linear-gradient(135deg,#00e5ff,#00ff88);color:#000;font-weight:700}
.bm{background:rgba(255,255,255,0.02);color:rgba(255,255,255,0.2);border:1px solid var(--border)}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:10px}
.chip{padding:5px 12px;background:rgba(0,229,255,0.02);border:1px solid rgba(0,229,255,0.06);border-radius:16px;color:rgba(0,229,255,0.35);font-size:11px;cursor:pointer;font-family:inherit;transition:all 0.2s}
.chip:hover{background:rgba(0,229,255,0.06);border-color:rgba(0,229,255,0.15);color:#00e5ff}

/* Response */
.resp{max-width:500px;width:100%;margin:0 auto;opacity:0;max-height:0;overflow:hidden;transition:all 0.4s;z-index:10;position:relative}
.resp.on{opacity:1;max-height:200px;margin-bottom:16px}
.rbox{background:var(--card);border:1px solid rgba(0,229,255,0.06);border-radius:12px;padding:14px 18px;backdrop-filter:blur(16px)}
.rbox p{font-size:13px;color:rgba(255,255,255,0.7);line-height:1.6;margin-bottom:8px}
.rbox .btns{display:flex;gap:5px}
.rbox .btns button{padding:5px 12px;background:rgba(0,229,255,0.05);border:1px solid rgba(0,229,255,0.1);border-radius:6px;color:#00e5ff;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:900px;z-index:10;position:relative}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.grid{grid-template-columns:1fr}}

/* Cards - viz as background */
.card{border-radius:14px;overflow:hidden;cursor:pointer;position:relative;min-height:160px;border:1px solid var(--border);transition:all 0.3s}
.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,0.1);box-shadow:0 12px 40px rgba(0,0,0,0.4)}
.card.active{border-color:var(--ac);box-shadow:0 0 20px var(--ac-glow,rgba(0,229,255,0.1))}
.card canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(6,6,16,0.95) 30%,rgba(6,6,16,0.4) 100%);z-index:1}
.card-content{position:relative;z-index:2;padding:14px 16px;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.card-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.card-icon{font-size:20px}
.card-title{font-size:15px;font-weight:700;letter-spacing:-0.3px}
.card-tag{margin-left:auto;padding:2px 7px;border-radius:3px;font-size:8px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;font-family:'Azeret Mono',monospace}
.card-desc{font-size:11px;color:rgba(255,255,255,0.3);line-height:1.5}
.card-meta{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:9px;color:rgba(255,255,255,0.2);font-family:'Azeret Mono',monospace}
.card-meta .dot{width:4px;height:4px;border-radius:50%;animation:p 2s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:0.3}}

/* Accent top border on hover */
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--ac);opacity:0;transition:opacity 0.3s;z-index:3}
.card:hover::after,.card.active::after{opacity:1}

.status{position:fixed;bottom:0;left:0;right:0;height:22px;background:rgba(6,6,16,0.9);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:16px;z-index:60;font-family:'Azeret Mono',monospace;font-size:9px;color:rgba(0,229,255,0.2)}
</style>
</head>
<body>
<nav class="topbar"><div class="brand"><em>IHE</em> Constellation</div><button>Subscribe ✦</button></nav>

<div class="page">
<div class="hub">
    <h1>Navigate to <em>anywhere</em></h1>
    <p class="sub">type a question or click a destination</p>
    <div class="bar">
        <div class="orb"><i>🧭</i></div>
        <input type="text" id="inp" placeholder="I teach biology and I'm new to AI..." autocomplete="off">
        <button class="bm">🎙</button>
        <button class="bs" id="go">→</button>
    </div>
    <div class="chips">
        <button class="chip" data-q="new to AI">🌱 New to AI</button>
        <button class="chip" data-q="play news">▶ Pulse</button>
        <button class="chip" data-q="tools">🛠 Tools</button>
        <button class="chip" data-q="podcast">🎙 Pod</button>
        <button class="chip" data-q="prompts">💡 Prompts</button>
        <button class="chip" data-q="case studies">📊 Cases</button>
    </div>
</div>

<div class="resp" id="resp"><div class="rbox"><p id="rT"></p><div class="btns" id="rB"></div></div></div>

<div class="grid" id="grid"></div>
</div>

<div class="status"><span>◆ Constellation Online</span><span>9 destinations</span><span>Feb 7, 2026</span></div>

<script>
const pages=[
{id:'pulse',icon:'📡',title:'Innovation Pulse',tag:'DAILY',tc:'#00e5ff',desc:'AI news. 4 stories. Every morning.',stat:'Updated today',viz:'waveform',kw:['news','pulse','daily','play','today'],resp:{t:"Morning briefing ready — 4 stories by Dr. Jones.",a:['▶ Play','Read']}},
{id:'podcast',icon:'🎙',title:'Podcast',tag:'WEEKLY',tc:'#c850c0',desc:'Deep interviews. Campus transformations.',stat:'24 episodes',viz:'circles',kw:['podcast','episode','listen'],resp:{t:"Latest: AI-first campus transformation. 38 min.",a:['▶ Play','All']}},
{id:'tools',icon:'🛠',title:'AI Tools',tag:'50+',tc:'#00ff88',desc:'Curated directory. Filtered by role.',stat:'52 vetted',viz:'grid',kw:['tool','app','software','directory'],resp:{t:"50+ AI tools for higher ed.",a:['Browse','Teaching']}},
{id:'prompts',icon:'💡',title:'Prompts',tag:'COPY&USE',tc:'#ffd700',desc:'Ready-to-use. Lesson plans to rubrics.',stat:'120+',viz:'text',kw:['prompt','template'],resp:{t:"Copy-paste prompts for educators.",a:['Browse','Beginners']}},
{id:'tinkerlab',icon:'🔬',title:'Tinker Lab',tag:'5 MIN',tc:'#ff8c42',desc:'Quick AI experiments. Jump in.',stat:'18 labs',viz:'particles',kw:['tinker','lab','experiment'],resp:{t:"5-minute experiments. Try now.",a:['Latest','All']}},
{id:'guides',icon:'🌱',title:'Getting Started',tag:'START',tc:'#14b8a6',desc:'AI basics. No jargon. Step by step.',stat:'Beginner',viz:'path',kw:['new','start','begin','learn','teach','faculty','professor','help'],resp:{t:"Welcome. Let's start — no panic.",a:['Start','Quick']}},
{id:'cases',icon:'📊',title:'Case Studies',tag:'DATA',tc:'#a855f7',desc:'Real campuses. Real outcomes.',stat:'12 cases',viz:'bars',kw:['case','study','success'],resp:{t:"Measurable results from real campuses.",a:['Browse','Filter']}},
{id:'community',icon:'🤝',title:'Community',tag:'JOIN',tc:'#ff6b9d',desc:'200+ educators. Together.',stat:'214 members',viz:'network',kw:['community','connect','forum'],resp:{t:"200+ educators navigating AI together.",a:['Join','Events']}},
{id:'about',icon:'👩‍🏫',title:'About',tag:'FOUNDER',tc:'#f59e0b',desc:'Dr. Norma Jones. Mission & vision.',stat:'Est. 2024',viz:'rings',kw:['about','norma','jones','guest'],resp:{t:"Dr. Jones — innovation guide.",a:['Bio','Mission']}},
];

const grid=document.getElementById('grid');
pages.forEach(p=>{
    const c=document.createElement('div');
    c.className='card';c.dataset.id=p.id;
    c.style.setProperty('--ac',p.tc);c.style.setProperty('--ac-glow',p.tc+'20');
    c.innerHTML=`
    <canvas data-viz="${p.viz}" data-color="${p.tc}"></canvas>
    <div class="card-overlay"></div>
    <div class="card-content">
        <div class="card-top">
            <span class="card-icon">${p.icon}</span>
            <span class="card-title">${p.title}</span>
            <span class="card-tag" style="background:${p.tc}18;color:${p.tc}">${p.tag}</span>
        </div>
        <div class="card-desc">${p.desc}</div>
        <div class="card-meta"><span class="dot" style="background:${p.tc}"></span>${p.stat}</div>
    </div>`;
    c.addEventListener('click',()=>selectP(p));
    grid.appendChild(c);
});

function initViz(){
document.querySelectorAll('.card canvas').forEach(cv=>{
    const dpr=devicePixelRatio||1;const r=cv.parentElement.getBoundingClientRect();
    cv.width=r.width*dpr;cv.height=r.height*dpr;
    const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
    const viz=cv.dataset.viz,color=cv.dataset.color;
    const w=r.width,h=r.height;
    const rgb={r:parseInt(color.slice(1,3),16),g:parseInt(color.slice(3,5),16),b:parseInt(color.slice(5,7),16)};
    let f=Math.random()*100;
    function draw(){
        f+=0.015;ctx.clearRect(0,0,w,h);
        const c=`${rgb.r},${rgb.g},${rgb.b}`;
        if(viz==='waveform'){for(let l=0;l<3;l++){ctx.beginPath();for(let x=0;x<w;x++){const v=Math.sin(x*.03+f*2+l)*20+Math.sin(x*.06+f*3+l)*12;x===0?ctx.moveTo(x,h*0.4+v):ctx.lineTo(x,h*0.4+v)}ctx.strokeStyle=`rgba(${c},${0.25-l*0.08})`;ctx.lineWidth=2-l*0.5;ctx.stroke()}}
        else if(viz==='circles'){for(let i=0;i<7;i++){const x=w*0.15+i*w*0.1+Math.sin(f+i)*12;const y=h*0.4+Math.cos(f*1.2+i*0.6)*18;const rr=16+Math.sin(f*2+i)*8;ctx.beginPath();ctx.arc(x,y,rr,0,6.28);ctx.fillStyle=`rgba(${c},${0.04+i*0.012})`;ctx.fill();ctx.strokeStyle=`rgba(${c},0.08)`;ctx.lineWidth=0.5;ctx.stroke()}}
        else if(viz==='grid'){const cols=10,rows=6;for(let r=1;r<=rows;r++)for(let cc=1;cc<=cols;cc++){const p=Math.sin(f*2+r*0.4+cc*0.3)*0.4+0.6;ctx.beginPath();ctx.arc(cc*w/(cols+1),r*h/(rows+1),2+p*2,0,6.28);ctx.fillStyle=`rgba(${c},${0.1*p})`;ctx.fill()}}
        else if(viz==='text'){ctx.font='10px "Azeret Mono"';['> rubric...','> feedback...','> lesson...','> quiz...','> email...','> summary...','> outline...'].forEach((l,i)=>{const s=(f*12+i*24)%(h+40)-15;const a=Math.max(0,1-Math.abs(s-h*0.4)/(h*0.5));ctx.fillStyle=`rgba(${c},${0.2*a})`;ctx.fillText(l,12,s)})}
        else if(viz==='particles'){for(let i=0;i<22;i++){const x=(Math.sin(f*0.35+i*1.5)*0.4+0.5)*w;const y=(Math.cos(f*0.5+i*1.1)*0.4+0.45)*h;const s=2+Math.sin(f*2+i)*1;ctx.beginPath();ctx.arc(x,y,s,0,6.28);ctx.fillStyle=`rgba(${c},${0.15+Math.sin(f+i)*0.08})`;ctx.fill()}}
        else if(viz==='path'){const steps=8;for(let i=0;i<steps;i++){const x=14+i*(w-28)/(steps-1);const y=h*0.4+Math.sin(i*0.6)*20;const a=Math.sin(f*1.5-i*0.4)>0.2;ctx.beginPath();ctx.arc(x,y,a?7:4,0,6.28);ctx.fillStyle=`rgba(${c},${a?0.25:0.06})`;ctx.fill();if(i<steps-1){const nx=14+(i+1)*(w-28)/(steps-1);const ny=h*0.4+Math.sin((i+1)*0.6)*20;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(nx,ny);ctx.strokeStyle=`rgba(${c},0.04)`;ctx.lineWidth=1;ctx.stroke()}}}
        else if(viz==='bars'){const bars=12;const bw=(w-20)/bars;for(let i=0;i<bars;i++){const bh=8+Math.sin(f*1.5+i*0.5)*10+(i/bars)*45;ctx.fillStyle=`rgba(${c},${0.06+i*0.02})`;ctx.fillRect(10+i*bw+1,h*0.7-bh,bw-2,bh)}}
        else if(viz==='network'){const pts=[];for(let i=0;i<15;i++)pts.push({x:(Math.sin(f*0.2+i*1.8)*0.4+0.5)*w,y:(Math.cos(f*0.3+i*1.3)*0.4+0.45)*h});pts.forEach((a,i)=>pts.forEach((b,j)=>{if(j<=i)return;const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<70){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(${c},${0.05*(1-d/70)})`;ctx.lineWidth=0.5;ctx.stroke()}}));pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,6.28);ctx.fillStyle=`rgba(${c},0.2)`;ctx.fill()})}
        else if(viz==='rings'){for(let i=0;i<5;i++){const rr=12+i*14+Math.sin(f+i)*3;ctx.beginPath();ctx.arc(w/2,h*0.4,rr,0,6.28);ctx.strokeStyle=`rgba(${c},${0.06-i*0.01})`;ctx.lineWidth=1;ctx.stroke()}ctx.beginPath();ctx.arc(w/2,h*0.4,5,0,6.28);ctx.fillStyle=`rgba(${c},0.2)`;ctx.fill()}
        requestAnimationFrame(draw);
    }
    draw();
});
}
setTimeout(initViz,150);

function selectP(p){document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));document.querySelector(`[data-id="${p.id}"]`).classList.add('active');document.getElementById('rT').textContent=p.resp.t;document.getElementById('rB').innerHTML=p.resp.a.map(a=>`<button>${a}</button>`).join('');document.getElementById('resp').classList.add('on')}
function proc(t){if(!t.trim())return;const l=t.toLowerCase();let b=null,bs=0;pages.forEach(p=>{let s=0;p.kw.forEach(k=>{if(l.includes(k))s+=2});if(s>bs){bs=s;b=p}});if(!b)b=pages[5];selectP(b)}
document.getElementById('go').addEventListener('click',()=>{const i=document.getElementById('inp');proc(i.value);i.value=''});
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter'){proc(e.target.value);e.target.value=''}});
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>proc(c.dataset.q)));
</script>
</body>
</html>
