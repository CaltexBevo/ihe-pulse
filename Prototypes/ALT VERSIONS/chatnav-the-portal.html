<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IHE — The Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #020208;
            --deep: #06060f;
            --cyan: #00e5ff;
            --magenta: #c850c0;
            --green: #00ff88;
            --gold: #ffd700;
            --rose: #ff6b9d;
            --violet: #a855f7;
            --orange: #ff8c42;
            --teal: #14b8a6;
            --blue: #3b82f6;
            --red: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--void);
            font-family: 'Space Grotesk', sans-serif;
            color: white;
            height: 100vh;
            overflow: hidden;
            cursor: default;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* === TOP BAR === */
        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 50px;
            background: rgba(2, 2, 8, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 229, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .topbar-logo {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            background: linear-gradient(135deg, var(--cyan), var(--magenta));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
        }

        .topbar-name {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, var(--cyan), var(--magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .topbar-right {
            display: flex;
            gap: 6px;
        }

        .topbar-btn {
            padding: 6px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .topbar-btn:hover {
            background: rgba(0, 229, 255, 0.08);
            border-color: rgba(0, 229, 255, 0.2);
            color: var(--cyan);
        }

        .topbar-btn.primary {
            background: linear-gradient(135deg, var(--cyan), var(--magenta));
            border: none;
            color: white;
        }

        /* === CHAT HUB (always visible at bottom) === */
        .chat-hub {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 560px;
            z-index: 50;
        }

        .chat-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(6, 6, 15, 0.92);
            border: 1px solid rgba(0, 229, 255, 0.12);
            border-radius: 16px;
            backdrop-filter: blur(24px);
            box-shadow: 0 0 60px rgba(0, 229, 255, 0.06), 0 20px 60px rgba(0,0,0,0.4);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .chat-wrapper:focus-within {
            border-color: rgba(0, 229, 255, 0.3);
            box-shadow: 0 0 80px rgba(0, 229, 255, 0.1), 0 20px 60px rgba(0,0,0,0.4);
        }

        .chat-orb {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--cyan), var(--magenta), var(--cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            animation: orbSpin 4s linear infinite;
            box-shadow: 0 0 24px rgba(0, 229, 255, 0.3);
        }

        .chat-orb-inner {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--deep);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        @keyframes orbSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .chat-input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            padding: 8px 4px;
        }

        .chat-input::placeholder { color: rgba(255,255,255,0.25); }

        .chat-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .btn-mic {
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .btn-mic:hover { background: rgba(0, 229, 255, 0.1); color: var(--cyan); }

        .btn-send {
            background: linear-gradient(135deg, var(--cyan), var(--magenta));
            color: white;
            font-weight: 700;
        }

        .btn-send:hover { transform: scale(1.08); box-shadow: 0 0 20px rgba(0, 229, 255, 0.3); }

        /* === QUICK CHIPS === */
        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 10px;
        }

        .chip {
            padding: 6px 14px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .chip:hover {
            background: rgba(0, 229, 255, 0.06);
            border-color: rgba(0, 229, 255, 0.2);
            color: var(--cyan);
        }

        /* === RESPONSE BUBBLE === */
        .response {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 520px;
            width: 90%;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }

        .response.visible { opacity: 1; pointer-events: auto; }

        .response-inner {
            background: rgba(6, 6, 15, 0.95);
            border: 1px solid rgba(0, 229, 255, 0.1);
            border-radius: 14px;
            padding: 16px 20px;
            backdrop-filter: blur(24px);
        }

        .response-text {
            font-size: 14px;
            line-height: 1.6;
            color: rgba(255,255,255,0.8);
            margin-bottom: 12px;
        }

        .response-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .response-btn {
            padding: 6px 14px;
            background: rgba(0, 229, 255, 0.06);
            border: 1px solid rgba(0, 229, 255, 0.15);
            border-radius: 8px;
            color: var(--cyan);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .response-btn:hover { background: rgba(0, 229, 255, 0.12); }

        /* === STATUS === */
        .status {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 24px;
            background: rgba(2, 2, 8, 0.85);
            border-top: 1px solid rgba(255,255,255,0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 60;
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: rgba(255,255,255,0.25);
        }

        .status .dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--green);
            display: inline-block;
            margin-right: 4px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <!-- TOP BAR -->
    <nav class="topbar">
        <div class="topbar-left">
            <div class="topbar-logo">IHE</div>
            <div class="topbar-name">Innovating Higher Ed</div>
        </div>
        <div class="topbar-right">
            <button class="topbar-btn">About</button>
            <button class="topbar-btn">Community</button>
            <button class="topbar-btn primary">Subscribe</button>
        </div>
    </nav>

    <!-- CANVAS -->
    <canvas id="portal"></canvas>

    <!-- CHAT HUB -->
    <div class="chat-hub">
        <div class="chat-wrapper">
            <div class="chat-orb"><div class="chat-orb-inner">🧭</div></div>
            <input type="text" class="chat-input" id="chatInput" placeholder="How can I help you explore?" autocomplete="off">
            <button class="chat-btn btn-mic">🎙</button>
            <button class="chat-btn btn-send" id="sendBtn">→</button>
        </div>
        <div class="chips">
            <button class="chip" data-q="new to AI">🌱 New to AI</button>
            <button class="chip" data-q="play news">▶ Today's Pulse</button>
            <button class="chip" data-q="tools">🛠 AI Tools</button>
            <button class="chip" data-q="podcast">🎙 Podcast</button>
            <button class="chip" data-q="prompts">💡 Prompts</button>
            <button class="chip" data-q="case studies">📊 Case Studies</button>
        </div>
    </div>

    <!-- RESPONSE -->
    <div class="response" id="response">
        <div class="response-inner">
            <div class="response-text" id="responseText"></div>
            <div class="response-btns" id="responseBtns"></div>
        </div>
    </div>

    <!-- STATUS -->
    <div class="status">
        <span><span class="dot"></span>Portal Online</span>
        <span>9 pathways • 51 resources</span>
        <span>IHE PULSE • Feb 7, 2026</span>
    </div>

    <script>
    const canvas = document.getElementById('portal');
    const ctx = canvas.getContext('2d');
    let W, H, cx, cy;

    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        cx = W / 2;
        cy = H / 2;
        positionNodes();
    }

    // === NODE DEFINITIONS ===
    const nodes = [
        { id: 'pulse',     label: 'Innovation Pulse',  sub: 'Daily AI Briefing',       icon: '📡', color: '#00e5ff', keywords: ['news','pulse','daily','today','morning','play','briefing'] },
        { id: 'podcast',   label: 'Podcast',           sub: 'Dr. Jones Interviews',    icon: '🎙', color: '#c850c0', keywords: ['podcast','episode','listen','interview','norma'] },
        { id: 'tools',     label: 'AI Tools Directory', sub: '50+ Vetted for Higher Ed', icon: '🛠', color: '#00ff88', keywords: ['tool','app','software','directory','chatgpt','grading'] },
        { id: 'prompts',   label: 'Prompt Library',    sub: 'Copy → Paste → Teach',    icon: '💡', color: '#ffd700', keywords: ['prompt','template','write','generate'] },
        { id: 'tinkerlab', label: 'Tinker Lab',        sub: 'Experiments & Insights',   icon: '🔬', color: '#ff8c42', keywords: ['tinker','lab','experiment','try'] },
        { id: 'guides',    label: 'Getting Started',   sub: 'AI Basics for Faculty',    icon: '🌱', color: '#14b8a6', keywords: ['new','start','begin','learn','beginner','teach','faculty','professor','help','biology','english'] },
        { id: 'cases',     label: 'Case Studies',      sub: 'Real Campus Outcomes',     icon: '📊', color: '#a855f7', keywords: ['case','study','example','success','outcome','campus'] },
        { id: 'edtools',   label: 'Educator Resources', sub: 'Templates & Downloads',   icon: '📚', color: '#3b82f6', keywords: ['resource','download','template','worksheet','educator'] },
        { id: 'community', label: 'Community',         sub: 'Connect with Innovators',  icon: '🤝', color: '#ff6b9d', keywords: ['community','connect','forum','discuss','join'] },
        { id: 'guests',    label: 'Be Our Guest',      sub: 'Share Your Story',         icon: '✨', color: '#ef4444', keywords: ['guest','contribute','share','story','submit'] },
        { id: 'about',     label: 'About Dr. Jones',   sub: 'Mission & Vision',         icon: '👩‍🏫', color: '#f59e0b', keywords: ['about','norma','jones','mission','who'] },
    ];

    // State
    let selectedId = null;
    let hoverNodeId = null;
    let time = 0;
    let stars = [];
    let particles = [];

    // Create stars
    for (let i = 0; i < 300; i++) {
        stars.push({
            x: Math.random() * 4000 - 500,
            y: Math.random() * 2500 - 300,
            r: Math.random() * 1.2 + 0.2,
            a: Math.random() * 0.4 + 0.05,
            phase: Math.random() * Math.PI * 2
        });
    }

    // Position nodes in radial layout
    function positionNodes() {
        const baseRadius = Math.min(W * 0.33, H * 0.32, 340);
        nodes.forEach((n, i) => {
            const angle = (i / nodes.length) * Math.PI * 2 - Math.PI / 2;
            n.tx = cx + Math.cos(angle) * baseRadius;
            n.ty = cy + Math.sin(angle) * baseRadius;
            if (n.x === undefined) { n.x = cx; n.y = cy; }
            n.angle = angle;
            n.radius = baseRadius;
            // Pulsation phase offset
            n.phase = i * 0.7;
        });
    }

    resize();
    window.addEventListener('resize', resize);

    // === PARTICLE SYSTEM ===
    function spawnParticle(node) {
        const speed = 0.003 + Math.random() * 0.004;
        particles.push({
            nodeId: node.id,
            t: 0,
            speed: speed,
            size: 1.5 + Math.random() * 2,
            color: node.color,
            fromCenter: Math.random() > 0.5
        });
    }

    // Spawn ambient particles
    setInterval(() => {
        nodes.forEach(n => {
            if (Math.random() < 0.3) spawnParticle(n);
            if (n.id === selectedId && Math.random() < 0.6) spawnParticle(n);
        });
    }, 150);

    // === RENDER ===
    function render() {
        time += 0.008;
        ctx.clearRect(0, 0, W, H);

        // Background gradient
        const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
        bgGrad.addColorStop(0, 'rgba(6, 6, 20, 1)');
        bgGrad.addColorStop(0.5, 'rgba(3, 3, 12, 1)');
        bgGrad.addColorStop(1, 'rgba(2, 2, 8, 1)');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);

        // Stars
        stars.forEach(s => {
            const twinkle = Math.sin(time * 1.5 + s.phase) * 0.4 + 0.6;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(180, 200, 255, ${s.a * twinkle})`;
            ctx.fill();
        });

        // === CENTER HUB ===
        // Hub outer glow rings
        for (let ring = 3; ring >= 0; ring--) {
            const r = 50 + ring * 18 + Math.sin(time * 2) * 4;
            const alpha = 0.03 - ring * 0.006;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(0, 229, 255, ${alpha})`;
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // Hub core glow
        const hubPulse = Math.sin(time * 2) * 0.15 + 0.85;
        const hubGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 70);
        hubGrad.addColorStop(0, `rgba(0, 229, 255, ${0.12 * hubPulse})`);
        hubGrad.addColorStop(0.4, `rgba(200, 80, 192, ${0.06 * hubPulse})`);
        hubGrad.addColorStop(1, 'rgba(0, 229, 255, 0)');
        ctx.beginPath();
        ctx.arc(cx, cy, 70, 0, Math.PI * 2);
        ctx.fillStyle = hubGrad;
        ctx.fill();

        // Hub inner orb
        const orbGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 22);
        orbGrad.addColorStop(0, `rgba(0, 229, 255, ${0.9 * hubPulse})`);
        orbGrad.addColorStop(0.6, `rgba(200, 80, 192, ${0.5 * hubPulse})`);
        orbGrad.addColorStop(1, 'rgba(0, 229, 255, 0)');
        ctx.beginPath();
        ctx.arc(cx, cy, 22, 0, Math.PI * 2);
        ctx.fillStyle = orbGrad;
        ctx.fill();

        // Hub spinning ring
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(time * 0.5);
        ctx.beginPath();
        ctx.arc(0, 0, 30, 0, Math.PI * 0.8);
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.4)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, 30, Math.PI, Math.PI * 1.8);
        ctx.strokeStyle = 'rgba(200, 80, 192, 0.4)';
        ctx.stroke();
        ctx.restore();

        // Hub label
        ctx.font = '600 11px "Space Grotesk"';
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.textAlign = 'center';
        ctx.fillText('CHAT-NAV', cx, cy + 48);

        // === NODES & BEAMS ===
        nodes.forEach((n, i) => {
            // Lerp to target
            n.x += (n.tx - n.x) * 0.06;
            n.y += (n.ty - n.y) * 0.06;

            const isSelected = n.id === selectedId;
            const isHovered = n.id === hoverNodeId;
            const nodePulse = Math.sin(time * 2.5 + n.phase) * 0.3 + 0.7;
            const intensity = isSelected ? 1 : isHovered ? 0.8 : 0.5;

            // === BEAM (connection line) ===
            const beamGrad = ctx.createLinearGradient(cx, cy, n.x, n.y);
            const beamAlpha = isSelected ? 0.35 : isHovered ? 0.2 : 0.07;
            beamGrad.addColorStop(0, `rgba(0, 229, 255, ${beamAlpha * 0.5})`);
            beamGrad.addColorStop(0.3, hexToRGBA(n.color, beamAlpha * 0.8));
            beamGrad.addColorStop(1, hexToRGBA(n.color, beamAlpha));

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            // Slight curve
            const midX = (cx + n.x) / 2 + Math.sin(time + n.phase) * 12;
            const midY = (cy + n.y) / 2 + Math.cos(time + n.phase) * 12;
            ctx.quadraticCurveTo(midX, midY, n.x, n.y);
            ctx.strokeStyle = beamGrad;
            ctx.lineWidth = isSelected ? 2.5 : isHovered ? 1.8 : 1;
            ctx.stroke();

            // Beam glow (wider, more transparent)
            if (isSelected || isHovered) {
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.quadraticCurveTo(midX, midY, n.x, n.y);
                ctx.strokeStyle = hexToRGBA(n.color, 0.06);
                ctx.lineWidth = 12;
                ctx.stroke();
            }

            // === NODE ===
            // Outer pulsating ring
            const nodeR = isSelected ? 34 : isHovered ? 30 : 26;
            const pulseR = nodeR + nodePulse * (isSelected ? 12 : 6);

            // Glow
            const glowGrad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, pulseR + 20);
            glowGrad.addColorStop(0, hexToRGBA(n.color, 0.15 * intensity));
            glowGrad.addColorStop(1, hexToRGBA(n.color, 0));
            ctx.beginPath();
            ctx.arc(n.x, n.y, pulseR + 20, 0, Math.PI * 2);
            ctx.fillStyle = glowGrad;
            ctx.fill();

            // Pulsating ring
            ctx.beginPath();
            ctx.arc(n.x, n.y, pulseR, 0, Math.PI * 2);
            ctx.strokeStyle = hexToRGBA(n.color, 0.15 * nodePulse * intensity);
            ctx.lineWidth = 1;
            ctx.stroke();

            // Second pulse ring (offset phase)
            const pulse2 = Math.sin(time * 2.5 + n.phase + 1.5) * 0.3 + 0.7;
            ctx.beginPath();
            ctx.arc(n.x, n.y, nodeR + pulse2 * (isSelected ? 18 : 10), 0, Math.PI * 2);
            ctx.strokeStyle = hexToRGBA(n.color, 0.06 * pulse2 * intensity);
            ctx.lineWidth = 1;
            ctx.stroke();

            // Solid core
            const coreGrad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, nodeR);
            coreGrad.addColorStop(0, hexToRGBA(n.color, 0.25 * intensity));
            coreGrad.addColorStop(0.7, hexToRGBA(n.color, 0.08 * intensity));
            coreGrad.addColorStop(1, hexToRGBA(n.color, 0.02));
            ctx.beginPath();
            ctx.arc(n.x, n.y, nodeR, 0, Math.PI * 2);
            ctx.fillStyle = coreGrad;
            ctx.fill();

            // Border
            ctx.beginPath();
            ctx.arc(n.x, n.y, nodeR, 0, Math.PI * 2);
            ctx.strokeStyle = hexToRGBA(n.color, 0.3 * intensity);
            ctx.lineWidth = isSelected ? 2 : 1;
            ctx.stroke();

            // Icon
            ctx.font = `${isSelected ? 22 : 18}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(n.icon, n.x, n.y);

            // Label
            const labelY = n.y + nodeR + 16;
            ctx.font = `${isSelected ? '700' : '600'} ${isSelected ? 13 : 12}px "Space Grotesk"`;
            ctx.fillStyle = isSelected ? '#ffffff' : isHovered ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.55)';
            ctx.textBaseline = 'top';
            ctx.fillText(n.label, n.x, labelY);

            // Sub label
            ctx.font = '400 10px "JetBrains Mono"';
            ctx.fillStyle = isSelected ? hexToRGBA(n.color, 0.8) : 'rgba(255,255,255,0.2)';
            ctx.fillText(n.sub, n.x, labelY + 16);
        });

        // === PARTICLES ===
        particles = particles.filter(p => {
            p.t += p.speed;
            if (p.t > 1) return false;

            const node = nodes.find(n => n.id === p.nodeId);
            if (!node) return false;

            const t = p.fromCenter ? p.t : 1 - p.t;
            // Quadratic bezier point
            const midX = (cx + node.x) / 2 + Math.sin(time + node.phase) * 12;
            const midY = (cy + node.y) / 2 + Math.cos(time + node.phase) * 12;
            const u = 1 - t;
            const px = u * u * cx + 2 * u * t * midX + t * t * node.x;
            const py = u * u * cy + 2 * u * t * midY + t * t * node.y;

            // Particle glow
            ctx.beginPath();
            ctx.arc(px, py, p.size + 3, 0, Math.PI * 2);
            ctx.fillStyle = hexToRGBA(p.color, 0.1);
            ctx.fill();

            // Particle core
            ctx.beginPath();
            ctx.arc(px, py, p.size, 0, Math.PI * 2);
            ctx.fillStyle = hexToRGBA(p.color, 0.6);
            ctx.fill();

            return true;
        });

        requestAnimationFrame(render);
    }

    render();

    // === HIT DETECTION ===
    canvas.addEventListener('mousemove', (e) => {
        const mx = e.clientX, my = e.clientY;
        hoverNodeId = null;
        canvas.style.cursor = 'default';

        nodes.forEach(n => {
            const dx = mx - n.x, dy = my - n.y;
            if (Math.sqrt(dx*dx + dy*dy) < 40) {
                hoverNodeId = n.id;
                canvas.style.cursor = 'pointer';
            }
        });
    });

    canvas.addEventListener('click', (e) => {
        const mx = e.clientX, my = e.clientY;
        nodes.forEach(n => {
            const dx = mx - n.x, dy = my - n.y;
            if (Math.sqrt(dx*dx + dy*dy) < 40) {
                selectNode(n);
            }
        });
    });

    function selectNode(node) {
        selectedId = node.id;
        // Burst particles toward selected node
        for (let i = 0; i < 8; i++) {
            setTimeout(() => spawnParticle(node), i * 50);
        }
        showResponse(node);
    }

    function showResponse(node) {
        const msgs = {
            pulse:    { text: "Your morning AI briefing — 4 stories, 1 deep dive. Narrated by Dr. Norma Jones. Ready to play.", actions: ['▶ Play Audio', 'Read Stories', 'This Week'] },
            podcast:  { text: "Latest episode: A dean who transformed their campus through AI. 38 minutes of real talk.", actions: ['▶ Play Episode', 'All Episodes', 'Be a Guest'] },
            tools:    { text: "50+ AI tools vetted specifically for higher education. I can filter by your role or task.", actions: ['Browse All', 'Teaching Tools', 'Admin Tools'] },
            prompts:  { text: "Copy-paste prompts built for educators. From syllabus design to student feedback.", actions: ['Browse All', 'For Beginners', 'By Subject'] },
            tinkerlab:{ text: "Quick experiments from Dr. Jones. Try something new in 5 minutes.", actions: ['Latest', 'Browse All', 'Submit Yours'] },
            guides:   { text: "Welcome. Let's start with the fundamentals — no jargon, no panic. I'll walk you through it.", actions: ['Start Path', 'What is AI?', 'Quick-Start'] },
            cases:    { text: "Real outcomes from real campuses. Measurable results, honest challenges.", actions: ['Browse All', 'By Size', 'Submit Story'] },
            edtools:  { text: "Templates, worksheets, and downloads designed for higher ed faculty.", actions: ['Browse All', 'Lesson Plans', 'Policy Templates'] },
            community:{ text: "200+ educators navigating AI together. Questions, wins, honest conversations.", actions: ['Join', 'Events', 'Forum'] },
            guests:   { text: "Got a story to tell? We want to hear it. Share your AI journey with the community.", actions: ['Apply Now', 'Guidelines', 'Past Guests'] },
            about:    { text: "Dr. Norma Jones — AI integration leader, educator, and your guide to innovation.", actions: ['Read Bio', 'Mission', 'Contact'] },
        };

        const msg = msgs[node.id] || { text: 'Exploring...', actions: ['Go'] };
        document.getElementById('responseText').textContent = msg.text;
        document.getElementById('responseBtns').innerHTML = msg.actions.map(a => `<button class="response-btn">${a}</button>`).join('');
        document.getElementById('response').classList.add('visible');
    }

    // === CHAT INPUT ===
    function processInput(text) {
        if (!text.trim()) return;
        const lower = text.toLowerCase();
        let best = null, bestScore = 0;

        nodes.forEach(n => {
            let score = 0;
            n.keywords.forEach(kw => { if (lower.includes(kw)) score += 2; });
            if (score > bestScore) { bestScore = score; best = n; }
        });

        if (!best) best = nodes.find(n => n.id === 'guides');
        selectNode(best);
    }

    document.getElementById('sendBtn').addEventListener('click', () => {
        const inp = document.getElementById('chatInput');
        processInput(inp.value);
        inp.value = '';
    });

    document.getElementById('chatInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') { processInput(e.target.value); e.target.value = ''; }
    });

    document.querySelectorAll('.chip').forEach(c => {
        c.addEventListener('click', () => processInput(c.dataset.q));
    });

    // === UTILITY ===
    function hexToRGBA(hex, alpha) {
        const r = parseInt(hex.slice(1,3), 16);
        const g = parseInt(hex.slice(3,5), 16);
        const b = parseInt(hex.slice(5,7), 16);
        return `rgba(${r},${g},${b},${alpha})`;
    }
    </script>
</body>
</html>
