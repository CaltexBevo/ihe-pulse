<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IHE — The Observatory</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0a0a10;
    --card: rgba(14,14,24,0.9);
    --border: rgba(255,255,255,0.05);
}
* { margin:0;padding:0;box-sizing:border-box }
body { background:var(--bg);font-family:'DM Sans',sans-serif;color:#fff;min-height:100vh;overflow-x:hidden }
body::before {
    content:'';position:fixed;inset:0;
    background:radial-gradient(ellipse at 50% 30%,rgba(200,80,192,0.04) 0%,transparent 55%),
               radial-gradient(ellipse at 20% 80%,rgba(0,229,255,0.03) 0%,transparent 50%);
    pointer-events:none;z-index:0;
}

.topbar{position:fixed;top:0;left:0;right:0;height:52px;background:rgba(10,10,16,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:100}
.brand{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;letter-spacing:-0.5px}
.brand em{font-style:normal;background:linear-gradient(90deg,#c850c0,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar-r{display:flex;gap:6px}
.topbar-r button{padding:7px 16px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:8px;color:rgba(255,255,255,0.45);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all 0.2s}
.topbar-r button:hover{border-color:rgba(200,80,192,0.2);color:#c850c0}
.topbar-r .cta{background:linear-gradient(135deg,#c850c0,#00e5ff);border:none;color:#fff;font-weight:600}

.page{padding:72px 24px 48px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1}

/* === CHAT === */
.chat-section{max-width:640px;width:100%;margin:20px auto 36px;text-align:center}
.chat-section h1{font-family:'Syne',sans-serif;font-size:36px;font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin-bottom:8px}
.chat-section h1 em{font-style:normal;background:linear-gradient(90deg,#c850c0,#ff6b9d,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.chat-section .sub{font-size:14px;color:rgba(255,255,255,0.3);margin-bottom:20px}
.chat-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border:1px solid var(--border);border-radius:18px;backdrop-filter:blur(20px);box-shadow:0 0 60px rgba(200,80,192,0.04),0 10px 40px rgba(0,0,0,0.3)}
.chat-bar:focus-within{border-color:rgba(200,80,192,0.2)}
.orb{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#c850c0,#00e5ff);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;animation:orbGlow 3s ease-in-out infinite}
@keyframes orbGlow{0%,100%{box-shadow:0 0 20px rgba(200,80,192,0.2)}50%{box-shadow:0 0 40px rgba(200,80,192,0.35)}}
.chat-bar input{flex:1;background:none;border:none;outline:none;color:#fff;font-family:'DM Sans';font-size:15px;padding:8px}
.chat-bar input::placeholder{color:rgba(255,255,255,0.18)}
.chat-bar button{width:38px;height:38px;border-radius:10px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.btn-s{background:linear-gradient(135deg,#c850c0,#00e5ff);color:#fff;font-weight:700}
.btn-m{background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.25);border:1px solid var(--border)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.chip{padding:6px 14px;background:rgba(200,80,192,0.03);border:1px solid rgba(200,80,192,0.08);border-radius:20px;color:rgba(255,255,255,0.3);font-size:12px;cursor:pointer;font-family:inherit;transition:all 0.2s}
.chip:hover{background:rgba(200,80,192,0.08);border-color:rgba(200,80,192,0.2);color:#c850c0}

.resp{max-width:600px;width:100%;margin:0 auto;opacity:0;max-height:0;overflow:hidden;transition:all 0.4s}
.resp.on{opacity:1;max-height:200px;margin-bottom:24px}
.resp-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 20px;backdrop-filter:blur(20px)}
.resp-box p{font-size:14px;color:rgba(255,255,255,0.7);line-height:1.6;margin-bottom:10px}
.resp-box .btns{display:flex;gap:6px;flex-wrap:wrap}
.resp-box .btns button{padding:6px 14px;background:rgba(200,80,192,0.06);border:1px solid rgba(200,80,192,0.12);border-radius:8px;color:#c850c0;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}

.section-label{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:rgba(255,255,255,0.15);letter-spacing:3px;text-transform:uppercase;margin-bottom:20px}

/* === CARD GRID === */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;width:100%;max-width:1100px}

/* === CARDS === */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:all 0.35s ease;position:relative}
.card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,0.1);box-shadow:0 16px 48px rgba(0,0,0,0.4)}
.card.active{border-color:var(--ac)}
.card::before{content:'';position:absolute;bottom:0;left:0;right:0;height:50%;background:linear-gradient(to top,var(--ac-bg,rgba(200,80,192,0.03)),transparent);pointer-events:none;z-index:0;opacity:0;transition:opacity 0.3s}
.card:hover::before,.card.active::before{opacity:1}

.card-viz{height:140px;position:relative;overflow:hidden;z-index:1}
.card-viz canvas{width:100%;height:100%;display:block}
/* Fade overlay at bottom of viz */
.card-viz::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(to top,rgba(14,14,24,0.95),transparent);pointer-events:none}

.card-body{padding:16px 18px 18px;position:relative;z-index:1}
.card-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.card-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.card-info{flex:1}
.card-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;letter-spacing:-0.3px}
.card-tag{padding:2px 8px;border-radius:4px;font-size:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;margin-top:2px;display:inline-block}
.card-desc{font-size:13px;color:rgba(255,255,255,0.35);line-height:1.5;margin-bottom:10px}
.card-footer{display:flex;align-items:center;gap:6px;font-size:10px;color:rgba(255,255,255,0.2);font-family:'IBM Plex Mono',monospace}
.card-footer .dot{width:5px;height:5px;border-radius:50%;animation:p 2s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:0.3}}

.status{position:fixed;bottom:0;left:0;right:0;height:24px;background:rgba(10,10,16,0.9);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:20px;z-index:60;font-family:'IBM Plex Mono',monospace;font-size:9px;color:rgba(255,255,255,0.18)}
</style>
</head>
<body>
<nav class="topbar"><div class="brand"><em>IHE</em> Observatory</div><div class="topbar-r"><button>About</button><button>Community</button><button class="cta">Subscribe</button></div></nav>

<div class="page">
<div class="chat-section">
    <h1>Discover. Learn. <em>Innovate.</em></h1>
    <p class="sub">Your AI-powered guide to higher education innovation</p>
    <div class="chat-bar">
        <div class="orb">🧭</div>
        <input type="text" id="inp" placeholder="What are you looking for?" autocomplete="off">
        <button class="btn-m">🎙</button>
        <button class="btn-s" id="go">→</button>
    </div>
    <div class="chips">
        <button class="chip" data-q="new to AI">🌱 New to AI</button>
        <button class="chip" data-q="play news">▶ Today's Pulse</button>
        <button class="chip" data-q="tools">🛠 AI Tools</button>
        <button class="chip" data-q="podcast">🎙 Podcast</button>
        <button class="chip" data-q="prompts">💡 Prompts</button>
    </div>
</div>

<div class="resp" id="resp"><div class="resp-box"><p id="rT"></p><div class="btns" id="rB"></div></div></div>

<div class="section-label">— Destinations —</div>
<div class="grid" id="grid"></div>
</div>

<div class="status"><span>✦ Observatory Online</span><span>9 destinations</span></div>

<script>
const pages=[
{id:'pulse',icon:'📡',title:'Innovation Pulse',tag:'DAILY',tc:'#00e5ff',desc:'AI news narrated by Dr. Jones. 4 stories every morning.',stat:'Updated today',sc:'#00e5ff',viz:'waveform',kw:['news','pulse','daily','play','today'],resp:{t:"Morning briefing ready — 4 AI stories narrated by Dr. Jones.",a:['▶ Play','Read']}},
{id:'podcast',icon:'🎙',title:'Podcast',tag:'WEEKLY',tc:'#c850c0',desc:'Deep interviews with educators transforming campuses through AI.',stat:'24 episodes',sc:'#c850c0',viz:'circles',kw:['podcast','episode','listen'],resp:{t:"Latest: A dean who built an AI-first campus. 38 min.",a:['▶ Play','Archive']}},
{id:'tools',icon:'🛠',title:'AI Tools Directory',tag:'50+',tc:'#00ff88',desc:'Curated, vetted AI tools filtered by role and task.',stat:'52 tools',sc:'#00ff88',viz:'grid',kw:['tool','app','software','directory','chatgpt'],resp:{t:"50+ AI tools vetted for higher ed.",a:['Browse','Teaching']}},
{id:'prompts',icon:'💡',title:'Prompt Library',tag:'COPY & USE',tc:'#ffd700',desc:'Ready-to-use prompts for lesson plans, rubrics, feedback.',stat:'120+ prompts',sc:'#ffd700',viz:'text',kw:['prompt','template'],resp:{t:"Prompts built for higher ed. Copy, paste, teach.",a:['Browse','Beginners']}},
{id:'tinkerlab',icon:'🔬',title:'Tinker Lab',tag:'EXPERIMENT',tc:'#ff8c42',desc:"Quick experiments — try something new with AI in 5 minutes.",stat:'18 labs',sc:'#ff8c42',viz:'particles',kw:['tinker','lab','experiment'],resp:{t:"5-minute experiments from Dr. Jones.",a:['Latest','All']}},
{id:'guides',icon:'🌱',title:'Getting Started',tag:'START HERE',tc:'#14b8a6',desc:'AI fundamentals for faculty. No jargon, step by step.',stat:'Beginner friendly',sc:'#14b8a6',viz:'path',kw:['new','start','begin','learn','teach','faculty','professor','help'],resp:{t:"Welcome. No jargon, no panic. Let's start.",a:['Start','Quick-Start']}},
{id:'cases',icon:'📊',title:'Case Studies',tag:'EVIDENCE',tc:'#a855f7',desc:'Real outcomes from real campuses. Measurable results.',stat:'12 cases',sc:'#a855f7',viz:'bars',kw:['case','study','success'],resp:{t:"Real data from real campuses.",a:['Browse','Filter']}},
{id:'community',icon:'🤝',title:'Community',tag:'JOIN',tc:'#ff6b9d',desc:'200+ educators navigating AI together.',stat:'214 members',sc:'#ff6b9d',viz:'network',kw:['community','connect','forum'],resp:{t:"200+ educators, real conversations.",a:['Join','Events']}},
{id:'about',icon:'👩‍🏫',title:'About Dr. Jones',tag:'FOUNDER',tc:'#f59e0b',desc:'The mission, vision, and educator behind IHE.',stat:'Est. 2024',sc:'#f59e0b',viz:'rings',kw:['about','norma','jones','guest'],resp:{t:"Dr. Norma Jones — your innovation guide.",a:['Bio','Mission']}},
];

const grid=document.getElementById('grid');
pages.forEach(p=>{
    const c=document.createElement('div');
    c.className='card';c.dataset.id=p.id;
    c.style.setProperty('--ac',p.tc);c.style.setProperty('--ac-bg',p.tc+'08');
    c.innerHTML=`
    <div class="card-viz"><canvas data-viz="${p.viz}" data-color="${p.tc}"></canvas></div>
    <div class="card-body">
        <div class="card-row">
            <div class="card-icon" style="background:${p.tc}12">${p.icon}</div>
            <div class="card-info">
                <div class="card-title">${p.title}</div>
                <span class="card-tag" style="background:${p.tc}15;color:${p.tc}">${p.tag}</span>
            </div>
        </div>
        <div class="card-desc">${p.desc}</div>
        <div class="card-footer"><span class="dot" style="background:${p.sc}"></span>${p.stat}</div>
    </div>`;
    c.addEventListener('click',()=>selectP(p));
    grid.appendChild(c);
});

// Same viz engine
function initViz(){
document.querySelectorAll('.card-viz canvas').forEach(cv=>{
    const dpr=devicePixelRatio||1;const r=cv.getBoundingClientRect();
    cv.width=r.width*dpr;cv.height=r.height*dpr;
    const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
    const viz=cv.dataset.viz,color=cv.dataset.color;
    const w=r.width,h=r.height;
    const rgb={r:parseInt(color.slice(1,3),16),g:parseInt(color.slice(3,5),16),b:parseInt(color.slice(5,7),16)};
    let f=Math.random()*100;
    function draw(){
        f+=0.02;ctx.clearRect(0,0,w,h);
        ctx.fillStyle='rgba(14,14,24,0.2)';ctx.fillRect(0,0,w,h);
        const c=`${rgb.r},${rgb.g},${rgb.b}`;
        if(viz==='waveform'){ctx.beginPath();for(let x=0;x<w;x++){const v=Math.sin(x*.035+f*2)*18+Math.sin(x*.07+f*3)*10+Math.sin(x*.018+f)*22;x===0?ctx.moveTo(x,h/2+v):ctx.lineTo(x,h/2+v)}ctx.strokeStyle=`rgba(${c},0.45)`;ctx.lineWidth=2.5;ctx.stroke();ctx.beginPath();for(let x=0;x<w;x++){const v=Math.sin(x*.035+f*2)*18+Math.sin(x*.07+f*3)*10+Math.sin(x*.018+f)*22;x===0?ctx.moveTo(x,h/2-v):ctx.lineTo(x,h/2-v)}ctx.strokeStyle=`rgba(${c},0.15)`;ctx.lineWidth=1;ctx.stroke()}
        else if(viz==='circles'){for(let i=0;i<6;i++){const x=w*0.2+i*30+Math.sin(f+i)*10;const y=h/2+Math.cos(f*1.2+i*0.7)*15;const rr=20+Math.sin(f*2+i)*8;ctx.beginPath();ctx.arc(x,y,rr,0,6.28);ctx.fillStyle=`rgba(${c},${0.05+i*0.015})`;ctx.fill();ctx.strokeStyle=`rgba(${c},0.12)`;ctx.lineWidth=1;ctx.stroke()}}
        else if(viz==='grid'){const cols=10,rows=5;for(let r=1;r<=rows;r++)for(let cc=1;cc<=cols;cc++){const p=Math.sin(f*2+r*0.5+cc*0.3)*0.4+0.6;ctx.beginPath();ctx.arc(cc*w/(cols+1),r*h/(rows+1),2.5+p*2,0,6.28);ctx.fillStyle=`rgba(${c},${0.12*p})`;ctx.fill()}}
        else if(viz==='text'){ctx.font='11px "IBM Plex Mono"';['> Create a rubric...','> Write feedback...','> Design lesson...','> Generate quiz...','> Summarize for...','> Draft email...'].forEach((l,i)=>{const s=(f*14+i*22)%(h+30)-10;const a=Math.max(0,1-Math.abs(s-h/2)/(h/2));ctx.fillStyle=`rgba(${c},${0.25*a})`;ctx.fillText(l,14,s)})}
        else if(viz==='particles'){for(let i=0;i<25;i++){const x=(Math.sin(f*0.4+i*1.6)*0.38+0.5)*w;const y=(Math.cos(f*0.6+i*1.2)*0.38+0.5)*h;const s=2+Math.sin(f*2+i)*1.5;ctx.beginPath();ctx.arc(x,y,s,0,6.28);ctx.fillStyle=`rgba(${c},${0.2+Math.sin(f+i)*0.1})`;ctx.fill();ctx.beginPath();ctx.arc(x,y,s+5,0,6.28);ctx.fillStyle=`rgba(${c},0.03)`;ctx.fill()}}
        else if(viz==='path'){const steps=7;for(let i=0;i<steps;i++){const x=18+i*(w-36)/(steps-1);const y=h/2+Math.sin(i*0.7)*18;const a=Math.sin(f*1.5-i*0.5)>0.2;ctx.beginPath();ctx.arc(x,y,a?9:5,0,6.28);ctx.fillStyle=`rgba(${c},${a?0.35:0.08})`;ctx.fill();if(i<steps-1){const nx=18+(i+1)*(w-36)/(steps-1);const ny=h/2+Math.sin((i+1)*0.7)*18;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(nx,ny);ctx.strokeStyle=`rgba(${c},0.06)`;ctx.lineWidth=1;ctx.stroke()}}}
        else if(viz==='bars'){const bars=10;const bw=(w-30)/bars;for(let i=0;i<bars;i++){const bh=12+Math.sin(f*1.5+i*0.6)*12+(i/bars)*50;ctx.fillStyle=`rgba(${c},${0.1+i*0.025})`;ctx.fillRect(15+i*bw+2,h-8-bh,bw-4,bh)}}
        else if(viz==='network'){const pts=[];for(let i=0;i<14;i++)pts.push({x:(Math.sin(f*0.25+i*2)*0.38+0.5)*w,y:(Math.cos(f*0.35+i*1.5)*0.38+0.5)*h});pts.forEach((a,i)=>pts.forEach((b,j)=>{if(j<=i)return;const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<85){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(${c},${0.06*(1-d/85)})`;ctx.lineWidth=1;ctx.stroke()}}));pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,3,0,6.28);ctx.fillStyle=`rgba(${c},0.25)`;ctx.fill()})}
        else if(viz==='rings'){for(let i=0;i<5;i++){const rr=14+i*16+Math.sin(f+i)*4;ctx.beginPath();ctx.arc(w/2,h/2,rr,0,6.28);ctx.strokeStyle=`rgba(${c},${0.08-i*0.012})`;ctx.lineWidth=1.5-i*0.2;ctx.stroke()}ctx.beginPath();ctx.arc(w/2,h/2,6,0,6.28);ctx.fillStyle=`rgba(${c},0.3)`;ctx.fill()}
        requestAnimationFrame(draw);
    }
    draw();
});
}
setTimeout(initViz,100);

function selectP(p){document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));document.querySelector(`[data-id="${p.id}"]`).classList.add('active');document.getElementById('rT').textContent=p.resp.t;document.getElementById('rB').innerHTML=p.resp.a.map(a=>`<button>${a}</button>`).join('');document.getElementById('resp').classList.add('on')}
function proc(t){if(!t.trim())return;const l=t.toLowerCase();let b=null,bs=0;pages.forEach(p=>{let s=0;p.kw.forEach(k=>{if(l.includes(k))s+=2});if(s>bs){bs=s;b=p}});if(!b)b=pages[5];selectP(b)}
document.getElementById('go').addEventListener('click',()=>{const i=document.getElementById('inp');proc(i.value);i.value=''});
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter'){proc(e.target.value);e.target.value=''}});
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>proc(c.dataset.q)));
</script>
</body>
</html>
