<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IHE Portal — The Helix</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020208;font-family:'Space Grotesk',sans-serif;color:#fff;height:100vh;overflow:hidden}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
.topbar{position:fixed;top:0;left:0;right:0;height:48px;background:rgba(2,2,8,0.7);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,229,255,0.05);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}
.topbar .brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.topbar .brand .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#00e5ff,#c850c0)}
.topbar .brand span{background:linear-gradient(135deg,#00e5ff,#c850c0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.chat-hub{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);width:90%;max-width:540px;z-index:50}
.chat-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(6,6,15,0.92);border:1px solid rgba(0,229,255,0.1);border-radius:14px;backdrop-filter:blur(20px);box-shadow:0 0 50px rgba(0,229,255,0.05)}
.chat-bar:focus-within{border-color:rgba(0,229,255,0.25)}
.orb{width:38px;height:38px;border-radius:50%;background:conic-gradient(from 0deg,#00e5ff,#c850c0,#00ff88,#00e5ff);animation:spin 5s linear infinite;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.orb-inner{width:32px;height:32px;border-radius:50%;background:#06060f;display:flex;align-items:center;justify-content:center;font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.chat-bar input{flex:1;background:none;border:none;outline:none;color:#fff;font-family:inherit;font-size:14px;padding:6px}
.chat-bar input::placeholder{color:rgba(255,255,255,0.2)}
.chat-bar button{width:34px;height:34px;border-radius:9px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.btn-s{background:linear-gradient(135deg,#00e5ff,#c850c0);color:#fff}
.btn-m{background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.3);border:1px solid rgba(255,255,255,0.06)}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:8px}
.chip{padding:5px 12px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:16px;color:rgba(255,255,255,0.35);font-size:11px;cursor:pointer;font-family:inherit;transition:all 0.2s}
.chip:hover{background:rgba(0,229,255,0.06);border-color:rgba(0,229,255,0.2);color:#00e5ff}
.response{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);max-width:500px;width:90%;z-index:50;opacity:0;pointer-events:none;transition:opacity 0.4s}
.response.on{opacity:1;pointer-events:auto}
.response-box{background:rgba(6,6,15,0.95);border:1px solid rgba(0,229,255,0.08);border-radius:12px;padding:14px 18px;backdrop-filter:blur(20px)}
.response-box p{font-size:13px;line-height:1.6;color:rgba(255,255,255,0.75);margin-bottom:10px}
.response-box .btns{display:flex;gap:6px;flex-wrap:wrap}
.response-box .btns button{padding:5px 12px;background:rgba(0,229,255,0.06);border:1px solid rgba(0,229,255,0.12);border-radius:7px;color:#00e5ff;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.status{position:fixed;bottom:0;left:0;right:0;height:22px;background:rgba(2,2,8,0.85);border-top:1px solid rgba(255,255,255,0.02);display:flex;align-items:center;justify-content:center;gap:16px;z-index:60;font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,0.2)}
</style>
</head>
<body>
<nav class="topbar"><div class="brand"><div class="dot"></div><span>Innovating Higher Ed</span></div></nav>
<canvas id="c"></canvas>
<div class="chat-hub">
<div class="chat-bar">
<div class="orb"><div class="orb-inner">🧬</div></div>
<input type="text" id="inp" placeholder="Where shall we explore?" autocomplete="off">
<button class="btn-m">🎙</button>
<button class="btn-s" id="go">→</button>
</div>
<div class="chips">
<button class="chip" data-q="new to AI">🌱 New to AI</button>
<button class="chip" data-q="play news">▶ Today's Pulse</button>
<button class="chip" data-q="tools">🛠 AI Tools</button>
<button class="chip" data-q="podcast">🎙 Podcast</button>
<button class="chip" data-q="prompts">💡 Prompts</button>
<button class="chip" data-q="case studies">📊 Cases</button>
</div>
</div>
<div class="response" id="resp"><div class="response-box"><p id="rText"></p><div class="btns" id="rBtns"></div></div></div>
<div class="status"><span>⬤ Helix Online</span><span>11 strands • 51 resources</span></div>

<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H,cx,cy,t=0,sel=null,hover=null;
const nodes=[
{id:'pulse',label:'Innovation Pulse',sub:'Daily AI Briefing',icon:'📡',color:'#00e5ff',kw:['news','pulse','daily','play','today','briefing']},
{id:'podcast',label:'Podcast',sub:'Dr. Jones Interviews',icon:'🎙',color:'#c850c0',kw:['podcast','episode','listen']},
{id:'tools',label:'AI Tools Directory',sub:'50+ Vetted Tools',icon:'🛠',color:'#00ff88',kw:['tool','app','software','directory']},
{id:'prompts',label:'Prompt Library',sub:'Copy → Paste → Teach',icon:'💡',color:'#ffd700',kw:['prompt','template']},
{id:'tinkerlab',label:'Tinker Lab',sub:'Experiments & Insights',icon:'🔬',color:'#ff8c42',kw:['tinker','lab','experiment']},
{id:'guides',label:'Getting Started',sub:'AI Basics for Faculty',icon:'🌱',color:'#14b8a6',kw:['new','start','begin','learn','teach','faculty','professor','help','biology','english']},
{id:'cases',label:'Case Studies',sub:'Real Campus Outcomes',icon:'📊',color:'#a855f7',kw:['case','study','example','success']},
{id:'edtools',label:'Educator Resources',sub:'Templates & Downloads',icon:'📚',color:'#3b82f6',kw:['resource','download','template']},
{id:'community',label:'Community',sub:'Connect with Innovators',icon:'🤝',color:'#ff6b9d',kw:['community','connect','forum']},
{id:'guests',label:'Be Our Guest',sub:'Share Your Story',icon:'✨',color:'#ef4444',kw:['guest','contribute','share']},
{id:'about',label:'About Dr. Jones',sub:'Mission & Vision',icon:'👩‍🏫',color:'#f59e0b',kw:['about','norma','jones','mission']},
];

let particles=[];
function resize(){W=C.width=innerWidth;H=C.height=innerHeight;cx=W/2;cy=H/2}
resize();addEventListener('resize',resize);

// Stars
const stars=Array.from({length:250},()=>({x:Math.random()*4000-500,y:Math.random()*2500-300,r:Math.random()*1+0.2,a:Math.random()*0.3+0.05,p:Math.random()*6.28}));

function hex(h,a){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgba(${r},${g},${b},${a})`}

// Helix positioning
function getHelixPos(i,total){
    const spread=Math.min(H*0.7,600);
    const startY=cy-spread/2;
    const yPos=startY+(i/(total-1))*spread;
    const angle=(i/total)*Math.PI*4+t*0.3;
    const radiusX=Math.min(W*0.28,300);
    const xOff=Math.cos(angle)*radiusX;
    // Alternate strands
    const strand=i%2===0?1:-1;
    return{x:cx+xOff*strand*0.7,y:yPos};
}

function spawnP(n){particles.push({nid:n.id,t:0,sp:0.004+Math.random()*0.004,sz:1.5+Math.random()*1.5,col:n.color,dir:Math.random()>0.5})}
setInterval(()=>{nodes.forEach(n=>{if(Math.random()<0.25)spawnP(n);if(n.id===sel&&Math.random()<0.5)spawnP(n)})},180);

function render(){
    t+=0.008;
    X.clearRect(0,0,W,H);
    // BG
    const bg=X.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*0.6);
    bg.addColorStop(0,'rgba(8,4,20,1)');bg.addColorStop(1,'rgba(2,2,8,1)');
    X.fillStyle=bg;X.fillRect(0,0,W,H);
    // Stars
    stars.forEach(s=>{const tw=Math.sin(t*1.5+s.p)*0.3+0.7;X.beginPath();X.arc(s.x,s.y,s.r,0,6.28);X.fillStyle=`rgba(180,200,255,${s.a*tw})`;X.fill()});

    // Hub
    const hp=Math.sin(t*2)*0.15+0.85;
    for(let r=3;r>=0;r--){X.beginPath();X.arc(cx,cy,40+r*14+Math.sin(t*2)*3,0,6.28);X.strokeStyle=`rgba(0,229,255,${0.025-r*0.005})`;X.lineWidth=1;X.stroke()}
    const hg=X.createRadialGradient(cx,cy,0,cx,cy,35);
    hg.addColorStop(0,`rgba(0,229,255,${0.2*hp})`);hg.addColorStop(0.5,`rgba(200,80,192,${0.1*hp})`);hg.addColorStop(1,'rgba(0,0,0,0)');
    X.beginPath();X.arc(cx,cy,35,0,6.28);X.fillStyle=hg;X.fill();
    X.save();X.translate(cx,cy);X.rotate(t*0.6);
    X.beginPath();X.arc(0,0,24,0,Math.PI*0.7);X.strokeStyle='rgba(0,229,255,0.4)';X.lineWidth=2;X.stroke();
    X.beginPath();X.arc(0,0,24,Math.PI,Math.PI*1.7);X.strokeStyle='rgba(200,80,192,0.4)';X.stroke();
    X.restore();
    X.font='600 10px "Space Grotesk"';X.fillStyle='rgba(255,255,255,0.4)';X.textAlign='center';X.fillText('CHAT-NAV',cx,cy+52);

    // Helix strands (decorative curves)
    X.beginPath();
    for(let i=0;i<=100;i++){
        const ang=(i/100)*Math.PI*4+t*0.3;
        const yy=cy-Math.min(H*0.35,300)+(i/100)*Math.min(H*0.7,600);
        const xx=cx+Math.cos(ang)*Math.min(W*0.2,210);
        i===0?X.moveTo(xx,yy):X.lineTo(xx,yy);
    }
    X.strokeStyle='rgba(0,229,255,0.04)';X.lineWidth=1;X.stroke();
    X.beginPath();
    for(let i=0;i<=100;i++){
        const ang=(i/100)*Math.PI*4+t*0.3+Math.PI;
        const yy=cy-Math.min(H*0.35,300)+(i/100)*Math.min(H*0.7,600);
        const xx=cx+Math.cos(ang)*Math.min(W*0.2,210);
        i===0?X.moveTo(xx,yy):X.lineTo(xx,yy);
    }
    X.strokeStyle='rgba(200,80,192,0.04)';X.stroke();

    // Nodes
    nodes.forEach((n,i)=>{
        const pos=getHelixPos(i,nodes.length);
        n.x=n.x===undefined?cx:n.x;n.y=n.y===undefined?cy:n.y;
        n.x+=(pos.x-n.x)*0.05;n.y+=(pos.y-n.y)*0.05;
        const isSel=n.id===sel,isHov=n.id===hover;
        const intensity=isSel?1:isHov?0.8:0.45;
        const pulse=Math.sin(t*2.5+i*0.6)*0.3+0.7;
        const nr=isSel?30:isHov?26:22;

        // Beam to center
        const bAlpha=isSel?0.3:isHov?0.18:0.05;
        const bGrad=X.createLinearGradient(cx,cy,n.x,n.y);
        bGrad.addColorStop(0,`rgba(0,229,255,${bAlpha*0.4})`);
        bGrad.addColorStop(1,hex(n.color,bAlpha));
        X.beginPath();X.moveTo(cx,cy);
        const mx=(cx+n.x)/2+Math.sin(t+i)*10,my=(cy+n.y)/2+Math.cos(t+i)*10;
        X.quadraticCurveTo(mx,my,n.x,n.y);X.strokeStyle=bGrad;X.lineWidth=isSel?2.5:1;X.stroke();
        if(isSel||isHov){X.beginPath();X.moveTo(cx,cy);X.quadraticCurveTo(mx,my,n.x,n.y);X.strokeStyle=hex(n.color,0.04);X.lineWidth=10;X.stroke()}

        // Glow
        const gg=X.createRadialGradient(n.x,n.y,0,n.x,n.y,nr+20);
        gg.addColorStop(0,hex(n.color,0.12*intensity));gg.addColorStop(1,hex(n.color,0));
        X.beginPath();X.arc(n.x,n.y,nr+20,0,6.28);X.fillStyle=gg;X.fill();
        // Pulse ring
        X.beginPath();X.arc(n.x,n.y,nr+pulse*(isSel?14:7),0,6.28);X.strokeStyle=hex(n.color,0.1*pulse*intensity);X.lineWidth=1;X.stroke();
        // Core
        const cg=X.createRadialGradient(n.x,n.y,0,n.x,n.y,nr);
        cg.addColorStop(0,hex(n.color,0.2*intensity));cg.addColorStop(1,hex(n.color,0.02));
        X.beginPath();X.arc(n.x,n.y,nr,0,6.28);X.fillStyle=cg;X.fill();
        X.beginPath();X.arc(n.x,n.y,nr,0,6.28);X.strokeStyle=hex(n.color,0.25*intensity);X.lineWidth=isSel?2:1;X.stroke();
        // Icon
        X.font=`${isSel?20:16}px sans-serif`;X.textAlign='center';X.textBaseline='middle';X.fillText(n.icon,n.x,n.y);
        // Labels
        const lx=i%2===0?n.x+nr+14:n.x-nr-14;
        X.textAlign=i%2===0?'left':'right';
        X.font=`${isSel?'700':'600'} ${isSel?13:11}px "Space Grotesk"`;
        X.textBaseline='middle';X.fillStyle=isSel?'#fff':isHov?'rgba(255,255,255,0.8)':'rgba(255,255,255,0.45)';
        X.fillText(n.label,lx,n.y-7);
        X.font='400 9px "JetBrains Mono"';X.fillStyle=isSel?hex(n.color,0.8):'rgba(255,255,255,0.18)';
        X.fillText(n.sub,lx,n.y+8);
    });

    // Particles
    particles=particles.filter(p=>{
        p.t+=p.sp;if(p.t>1)return false;
        const n=nodes.find(x=>x.id===p.nid);if(!n)return false;
        const tt=p.dir?p.t:1-p.t;
        const mx=(cx+n.x)/2+Math.sin(t+nodes.indexOf(n))*10;
        const my=(cy+n.y)/2+Math.cos(t+nodes.indexOf(n))*10;
        const u=1-tt;
        const px=u*u*cx+2*u*tt*mx+tt*tt*n.x;
        const py=u*u*cy+2*u*tt*my+tt*tt*n.y;
        X.beginPath();X.arc(px,py,p.sz+2,0,6.28);X.fillStyle=hex(p.col,0.08);X.fill();
        X.beginPath();X.arc(px,py,p.sz,0,6.28);X.fillStyle=hex(p.col,0.5);X.fill();
        return true;
    });
    requestAnimationFrame(render);
}
render();

// Hit detection
C.addEventListener('mousemove',e=>{hover=null;C.style.cursor='default';nodes.forEach(n=>{const d=Math.hypot(e.clientX-n.x,e.clientY-n.y);if(d<40){hover=n.id;C.style.cursor='pointer'}})});
C.addEventListener('click',e=>{nodes.forEach(n=>{if(Math.hypot(e.clientX-n.x,e.clientY-n.y)<40)selectNode(n)})});

function selectNode(n){
    sel=n.id;
    for(let i=0;i<8;i++)setTimeout(()=>spawnP(n),i*50);
    showResp(n);
}

const msgs={
pulse:{t:"Morning AI briefing ready. 4 stories by Dr. Jones.",a:['▶ Play','Read Stories']},
podcast:{t:"Latest: A dean who transformed their campus through AI.",a:['▶ Play','All Episodes']},
tools:{t:"50+ AI tools vetted for higher ed. Filter by role or task.",a:['Browse All','Teaching','Admin']},
prompts:{t:"Copy-paste prompts built for educators.",a:['Browse','Beginners']},
tinkerlab:{t:"Quick experiments. Try something new in 5 minutes.",a:['Latest','Browse All']},
guides:{t:"Welcome. AI fundamentals — no jargon, no panic.",a:['Start','Quick-Start']},
cases:{t:"Real outcomes from real campuses.",a:['Browse','By Size']},
edtools:{t:"Templates and downloads for faculty.",a:['Browse','Lesson Plans']},
community:{t:"200+ educators navigating AI together.",a:['Join','Events']},
guests:{t:"Got a story? Share your AI journey.",a:['Apply','Guidelines']},
about:{t:"Dr. Norma Jones — your guide to innovation.",a:['Bio','Mission']},
};

function showResp(n){
    const m=msgs[n.id]||{t:'Exploring...',a:['Go']};
    document.getElementById('rText').textContent=m.t;
    document.getElementById('rBtns').innerHTML=m.a.map(a=>`<button>${a}</button>`).join('');
    document.getElementById('resp').classList.add('on');
}

function proc(text){
    if(!text.trim())return;const l=text.toLowerCase();let best=null,bs=0;
    nodes.forEach(n=>{let s=0;n.kw.forEach(k=>{if(l.includes(k))s+=2});if(l.includes('new')||l.includes('help'))if(n.id==='guides')s+=4;if(s>bs){bs=s;best=n}});
    if(!best)best=nodes[5];selectNode(best);
}
document.getElementById('go').addEventListener('click',()=>{const i=document.getElementById('inp');proc(i.value);i.value=''});
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter'){proc(e.target.value);e.target.value=''}});
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>proc(c.dataset.q)));
</script>
</body>
</html>
