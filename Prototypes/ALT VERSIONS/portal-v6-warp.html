<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IHE Portal — The Warp</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020208;font-family:'Space Grotesk',sans-serif;color:#fff;height:100vh;overflow:hidden}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
.topbar{position:fixed;top:0;left:0;right:0;height:48px;background:rgba(2,2,8,0.7);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,229,255,0.05);display:flex;align-items:center;padding:0 24px;z-index:100}
.topbar .brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.topbar .brand span{background:linear-gradient(135deg,#00e5ff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hub{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);width:90%;max-width:540px;z-index:50}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(6,6,15,0.92);border:1px solid rgba(0,229,255,0.1);border-radius:14px;backdrop-filter:blur(20px);box-shadow:0 0 50px rgba(0,229,255,0.05)}
.bar:focus-within{border-color:rgba(0,229,255,0.3)}
.orb{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff,#00e5ff,#0040ff);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 25px rgba(0,229,255,0.4)}
.bar input{flex:1;background:none;border:none;outline:none;color:#fff;font-family:inherit;font-size:14px;padding:6px}
.bar input::placeholder{color:rgba(0,229,255,0.25)}
.bar button{width:34px;height:34px;border-radius:9px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.bs{background:linear-gradient(135deg,#00e5ff,#00ff88);color:#000;font-weight:700}
.bm{background:rgba(255,255,255,0.03);color:rgba(0,229,255,0.4);border:1px solid rgba(0,229,255,0.08)}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:8px}
.chip{padding:5px 12px;background:rgba(0,229,255,0.02);border:1px solid rgba(0,229,255,0.06);border-radius:16px;color:rgba(0,229,255,0.4);font-size:11px;cursor:pointer;font-family:inherit;transition:all 0.2s}
.chip:hover{background:rgba(0,229,255,0.08);border-color:rgba(0,229,255,0.2);color:#00e5ff}
.resp{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);max-width:500px;width:90%;z-index:50;opacity:0;pointer-events:none;transition:opacity 0.4s}
.resp.on{opacity:1;pointer-events:auto}
.rbox{background:rgba(6,6,15,0.95);border:1px solid rgba(0,229,255,0.08);border-radius:12px;padding:14px 18px;backdrop-filter:blur(20px)}
.rbox p{font-size:13px;line-height:1.6;color:rgba(255,255,255,0.75);margin-bottom:10px}
.rbox .btns{display:flex;gap:6px;flex-wrap:wrap}
.rbox .btns button{padding:5px 12px;background:rgba(0,229,255,0.06);border:1px solid rgba(0,229,255,0.12);border-radius:7px;color:#00e5ff;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.status{position:fixed;bottom:0;left:0;right:0;height:22px;background:rgba(2,2,8,0.85);border-top:1px solid rgba(0,229,255,0.04);display:flex;align-items:center;justify-content:center;gap:16px;z-index:60;font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(0,229,255,0.25)}
</style>
</head>
<body>
<nav class="topbar"><div class="brand"><span>✦ Innovating Higher Ed</span></div></nav>
<canvas id="c"></canvas>
<div class="hub">
<div class="bar"><div class="orb"></div><input type="text" id="inp" placeholder="Set your destination..." autocomplete="off"><button class="bm">🎙</button><button class="bs" id="go">⟩</button></div>
<div class="chips"><button class="chip" data-q="new to AI">🌱 New to AI</button><button class="chip" data-q="play news">▶ Pulse</button><button class="chip" data-q="tools">🛠 Tools</button><button class="chip" data-q="podcast">🎙 Podcast</button><button class="chip" data-q="prompts">💡 Prompts</button><button class="chip" data-q="case studies">📊 Cases</button></div>
</div>
<div class="resp" id="resp"><div class="rbox"><p id="rT"></p><div class="btns" id="rB"></div></div></div>
<div class="status"><span>✦ Warp Online</span><span>11 destinations • 51 resources</span></div>

<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H,cx,cy,t=0,sel=null,hover=null;
const nodes=[
{id:'pulse',label:'Innovation Pulse',sub:'Daily Briefing',icon:'📡',color:'#00e5ff',kw:['news','pulse','daily','play','today']},
{id:'podcast',label:'Podcast',sub:'Dr. Jones',icon:'🎙',color:'#c850c0',kw:['podcast','episode','listen']},
{id:'tools',label:'AI Tools',sub:'50+ Vetted',icon:'🛠',color:'#00ff88',kw:['tool','app','software']},
{id:'prompts',label:'Prompts',sub:'Copy & Use',icon:'💡',color:'#ffd700',kw:['prompt','template']},
{id:'tinkerlab',label:'Tinker Lab',sub:'Experiments',icon:'🔬',color:'#ff8c42',kw:['tinker','lab']},
{id:'guides',label:'Getting Started',sub:'AI Basics',icon:'🌱',color:'#14b8a6',kw:['new','start','begin','learn','teach','faculty','professor','help']},
{id:'cases',label:'Case Studies',sub:'Outcomes',icon:'📊',color:'#a855f7',kw:['case','study','success']},
{id:'edtools',label:'Resources',sub:'Templates',icon:'📚',color:'#3b82f6',kw:['resource','download']},
{id:'community',label:'Community',sub:'Connect',icon:'🤝',color:'#ff6b9d',kw:['community','connect','forum']},
{id:'guests',label:'Be Our Guest',sub:'Share',icon:'✨',color:'#ef4444',kw:['guest','contribute']},
{id:'about',label:'About',sub:'Dr. Jones',icon:'👩‍🏫',color:'#f59e0b',kw:['about','norma']},
];

// Warp streaks
let streaks=[];
for(let i=0;i<150;i++){
    streaks.push({
        angle:Math.random()*6.28,
        dist:Math.random()*0.3+0.1,
        speed:Math.random()*0.004+0.002,
        length:Math.random()*40+10,
        a:Math.random()*0.15+0.02,
        color:Math.random()>0.7?'0,229,255':'180,200,255'
    });
}
let particles=[];

function resize(){W=C.width=innerWidth;H=C.height=innerHeight;cx=W/2;cy=H/2;posN()}
function posN(){
    const r=Math.min(W*0.34,H*0.32,340);
    nodes.forEach((n,i)=>{
        const a=(i/nodes.length)*6.28-Math.PI/2;
        n.tx=cx+Math.cos(a)*r;n.ty=cy+Math.sin(a)*r;
        if(n.x===undefined){n.x=cx;n.y=cy}n.angle=a;
    });
}
resize();addEventListener('resize',resize);
function hex(h,a){return`rgba(${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)},${a})`}
function spawnP(n){particles.push({nid:n.id,t:0,sp:0.005+Math.random()*0.005,sz:1.5+Math.random()*2,col:n.color,dir:Math.random()>0.3})}
setInterval(()=>{nodes.forEach(n=>{if(Math.random()<0.15)spawnP(n);if(n.id===sel&&Math.random()<0.5)spawnP(n)})},180);

function render(){
    t+=0.008;X.clearRect(0,0,W,H);
    X.fillStyle='#020208';X.fillRect(0,0,W,H);

    // Warp streaks from center
    const maxDist=Math.max(W,H)*0.7;
    streaks.forEach(s=>{
        s.dist+=s.speed;
        if(s.dist>1){s.dist=0.05;s.angle=Math.random()*6.28;s.a=Math.random()*0.15+0.02}
        const d1=s.dist*maxDist;
        const d2=(s.dist*maxDist)+s.length*(0.5+s.dist);
        const x1=cx+Math.cos(s.angle)*d1;
        const y1=cy+Math.sin(s.angle)*d1;
        const x2=cx+Math.cos(s.angle)*d2;
        const y2=cy+Math.sin(s.angle)*d2;
        X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);
        X.strokeStyle=`rgba(${s.color},${s.a*s.dist})`;X.lineWidth=1;X.stroke();
    });

    // Center warp core
    const hp=Math.sin(t*2)*0.15+0.85;
    for(let r=4;r>=0;r--){
        const rr=30+r*20+Math.sin(t*3)*3;
        const g=X.createRadialGradient(cx,cy,rr-5,cx,cy,rr+5);
        g.addColorStop(0,`rgba(0,229,255,${0.03-r*0.005})`);g.addColorStop(1,'rgba(0,0,0,0)');
        X.beginPath();X.arc(cx,cy,rr,0,6.28);X.fillStyle=g;X.fill();
    }
    // Bright center
    const cg=X.createRadialGradient(cx,cy,0,cx,cy,25);
    cg.addColorStop(0,`rgba(255,255,255,${0.4*hp})`);
    cg.addColorStop(0.3,`rgba(0,229,255,${0.2*hp})`);
    cg.addColorStop(1,'rgba(0,0,0,0)');
    X.beginPath();X.arc(cx,cy,25,0,6.28);X.fillStyle=cg;X.fill();
    // Spinning ring
    X.save();X.translate(cx,cy);X.rotate(t);
    X.beginPath();X.arc(0,0,18,0,Math.PI*0.6);X.strokeStyle='rgba(0,229,255,0.5)';X.lineWidth=2;X.stroke();
    X.beginPath();X.arc(0,0,18,Math.PI,Math.PI*1.6);X.strokeStyle='rgba(0,255,136,0.5)';X.stroke();
    X.restore();
    X.font='600 10px "Space Grotesk"';X.fillStyle='rgba(0,229,255,0.35)';X.textAlign='center';X.fillText('CHAT-NAV',cx,cy+44);

    // Nodes as warp waypoints
    nodes.forEach((n,i)=>{
        n.x+=(n.tx-n.x)*0.05;n.y+=(n.ty-n.y)*0.05;
        const isSel=n.id===sel,isHov=n.id===hover;
        const intensity=isSel?1:isHov?0.7:0.35;
        const pulse=Math.sin(t*2.5+i*0.5)*0.3+0.7;
        const nr=isSel?28:isHov?24:20;

        // Speed line beam to center
        const bA=isSel?0.3:isHov?0.18:0.04;
        // Multiple parallel lines for speed effect
        for(let l=-1;l<=1;l++){
            const off=l*3;
            const perpX=Math.cos(n.angle+Math.PI/2)*off;
            const perpY=Math.sin(n.angle+Math.PI/2)*off;
            X.beginPath();X.moveTo(cx+perpX,cy+perpY);X.lineTo(n.x+perpX,n.y+perpY);
            X.strokeStyle=hex(n.color,bA*(l===0?1:0.3));X.lineWidth=l===0?(isSel?2:1):0.5;X.stroke();
        }

        // Waypoint glow
        const gg=X.createRadialGradient(n.x,n.y,0,n.x,n.y,nr+18);
        gg.addColorStop(0,hex(n.color,0.15*intensity));gg.addColorStop(1,hex(n.color,0));
        X.beginPath();X.arc(n.x,n.y,nr+18,0,6.28);X.fillStyle=gg;X.fill();
        // Pulse ring
        X.beginPath();X.arc(n.x,n.y,nr+pulse*(isSel?12:5),0,6.28);X.strokeStyle=hex(n.color,0.1*pulse*intensity);X.lineWidth=1;X.stroke();
        // Diamond shape for waypoint
        X.save();X.translate(n.x,n.y);X.rotate(Math.PI/4);
        X.fillStyle=hex(n.color,0.06*intensity);
        X.fillRect(-nr*0.7,-nr*0.7,nr*1.4,nr*1.4);
        X.strokeStyle=hex(n.color,0.25*intensity);X.lineWidth=isSel?1.5:0.5;
        X.strokeRect(-nr*0.7,-nr*0.7,nr*1.4,nr*1.4);
        X.restore();
        // Icon
        X.font=`${isSel?20:16}px sans-serif`;X.textAlign='center';X.textBaseline='middle';X.fillText(n.icon,n.x,n.y);
        // Labels
        X.font=`${isSel?'600':'500'} ${isSel?12:11}px "Space Grotesk"`;
        X.fillStyle=isSel?'#fff':isHov?'rgba(255,255,255,0.7)':'rgba(255,255,255,0.4)';
        X.textBaseline='top';X.fillText(n.label,n.x,n.y+nr+10);
        X.font='400 9px "JetBrains Mono"';X.fillStyle=isSel?hex(n.color,0.7):'rgba(0,229,255,0.15)';
        X.fillText(n.sub,n.x,n.y+nr+24);
    });

    // Particles
    particles=particles.filter(p=>{
        p.t+=p.sp;if(p.t>1)return false;
        const n=nodes.find(x=>x.id===p.nid);if(!n)return false;
        const tt=p.dir?p.t:1-p.t;
        const px=cx+(n.x-cx)*tt,py=cy+(n.y-cy)*tt;
        // Streak shape
        const dx=(n.x-cx)*p.sp*8,dy=(n.y-cy)*p.sp*8;
        X.beginPath();X.moveTo(px-dx,py-dy);X.lineTo(px+dx,py+dy);
        X.strokeStyle=hex(p.col,0.5);X.lineWidth=p.sz;X.stroke();
        return true;
    });
    requestAnimationFrame(render);
}
render();

C.addEventListener('mousemove',e=>{hover=null;C.style.cursor='default';nodes.forEach(n=>{if(Math.hypot(e.clientX-n.x,e.clientY-n.y)<35){hover=n.id;C.style.cursor='pointer'}})});
C.addEventListener('click',e=>{nodes.forEach(n=>{if(Math.hypot(e.clientX-n.x,e.clientY-n.y)<35)selectN(n)})});
function selectN(n){sel=n.id;for(let i=0;i<12;i++)setTimeout(()=>spawnP(n),i*35);showR(n)}
const msgs={pulse:{t:"Briefing ready. 4 stories. Engage.",a:['▶ Play','Read']},podcast:{t:"Latest warp: AI ethics deep dive.",a:['▶ Play','All']},tools:{t:"50+ tools locked and loaded.",a:['Browse','Teaching']},prompts:{t:"Prompts ready for deployment.",a:['Browse','Init']},tinkerlab:{t:"5-minute lab. Jump in.",a:['Latest','All']},guides:{t:"Coordinates set: AI basics.",a:['Start','Quick']},cases:{t:"Real data. Real campuses.",a:['Browse','Filter']},edtools:{t:"Templates standing by.",a:['Browse','Plans']},community:{t:"200+ crew members online.",a:['Join','Events']},guests:{t:"Transmit your story.",a:['Apply','Info']},about:{t:"Captain: Dr. Norma Jones.",a:['Bio','Mission']}};
function showR(n){const m=msgs[n.id]||{t:'...',a:['Go']};document.getElementById('rT').textContent=m.t;document.getElementById('rB').innerHTML=m.a.map(a=>`<button>${a}</button>`).join('');document.getElementById('resp').classList.add('on')}
function proc(text){if(!text.trim())return;const l=text.toLowerCase();let b=null,bs=0;nodes.forEach(n=>{let s=0;n.kw.forEach(k=>{if(l.includes(k))s+=2});if(l.includes('new')||l.includes('help'))if(n.id==='guides')s+=4;if(s>bs){bs=s;b=n}});if(!b)b=nodes[5];selectN(b)}
document.getElementById('go').addEventListener('click',()=>{const i=document.getElementById('inp');proc(i.value);i.value=''});
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter'){proc(e.target.value);e.target.value=''}});
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>proc(c.dataset.q)));
</script>
</body>
</html>
