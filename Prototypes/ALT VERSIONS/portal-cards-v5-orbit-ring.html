<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IHE — Orbit Ring</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080d;--card:rgba(13,14,22,0.9);--brd:rgba(255,255,255,0.04);--cy:#00e5ff;--mg:#c850c0}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Manrope',sans-serif;color:#fff;height:100vh;overflow:hidden}
@media(max-width:800px){body{overflow:auto}}

.bg{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 50%,rgba(200,80,192,0.025) 0%,transparent 55%)}

canvas#beams{position:fixed;inset:0;z-index:1;pointer-events:none}

.topbar{position:fixed;top:0;left:0;right:0;height:44px;background:rgba(7,8,13,0.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:100}
.brand{font-weight:800;font-size:14px;letter-spacing:-0.3px}
.brand em{font-style:normal;background:linear-gradient(90deg,var(--mg),var(--cy));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar button{padding:5px 12px;background:linear-gradient(135deg,var(--mg),var(--cy));border:none;border-radius:6px;color:#fff;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit}

/* Full viewport layout */
.universe{position:fixed;inset:44px 0 0 0;display:flex;align-items:center;justify-content:center;z-index:2}
@media(max-width:800px){.universe{position:relative;inset:auto;min-height:calc(100vh - 44px);padding:60px 16px 30px;flex-direction:column}}

/* Hub */
.hub{position:relative;z-index:20;width:360px;max-width:88vw;text-align:center}
.hub h1{font-size:18px;font-weight:800;letter-spacing:-0.6px;margin-bottom:3px}
.hub h1 em{font-style:normal;background:linear-gradient(90deg,var(--cy),#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hub .sub{font-size:10px;color:rgba(255,255,255,0.18);font-family:'Space Mono',monospace;margin-bottom:10px}
.bar{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--card);border:1px solid rgba(0,229,255,0.07);border-radius:12px;backdrop-filter:blur(16px);box-shadow:0 0 50px rgba(0,229,255,0.03)}
.bar:focus-within{border-color:rgba(0,229,255,0.18)}
.orb{width:32px;height:32px;border-radius:50%;background:conic-gradient(from 0deg,var(--cy),var(--mg),var(--cy));animation:sp 5s linear infinite;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 14px rgba(0,229,255,0.18)}
.orb i{width:26px;height:26px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-style:normal}
@keyframes sp{to{transform:rotate(360deg)}}
.bar input{flex:1;background:none;border:none;outline:none;color:#fff;font-family:'Manrope';font-size:13px;padding:5px}
.bar input::placeholder{color:rgba(255,255,255,0.12)}
.bar .b{width:28px;height:28px;border-radius:7px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.bs{background:linear-gradient(135deg,var(--cy),var(--mg));color:#fff;font-weight:700}
.bm{background:rgba(255,255,255,0.02);color:rgba(255,255,255,0.18);border:1px solid var(--brd)}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px}
.chip{padding:3px 10px;background:rgba(255,255,255,0.015);border:1px solid var(--brd);border-radius:12px;color:rgba(255,255,255,0.2);font-size:9px;cursor:pointer;font-family:inherit;transition:all 0.2s}
.chip:hover{background:rgba(0,229,255,0.04);border-color:rgba(0,229,255,0.1);color:var(--cy)}

.resp{margin-top:8px;opacity:0;max-height:0;overflow:hidden;transition:all 0.35s}
.resp.on{opacity:1;max-height:140px}
.rbox{background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:10px 14px;text-align:left}
.rbox p{font-size:12px;color:rgba(255,255,255,0.65);line-height:1.5;margin-bottom:6px}
.rbox .acts{display:flex;gap:4px}
.rbox .acts button{padding:3px 10px;background:rgba(0,229,255,0.04);border:1px solid rgba(0,229,255,0.08);border-radius:5px;color:var(--cy);font-size:9px;font-weight:600;cursor:pointer;font-family:inherit}

/* Cards */
.ring{position:absolute;inset:0;z-index:10;pointer-events:none}
@media(max-width:800px){.ring{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:16px;pointer-events:all}}

.card{
    position:absolute;
    width:155px;
    background:var(--card);
    border:1px solid var(--brd);
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    pointer-events:all;
    transition:all 0.3s;
}
@media(max-width:800px){.card{position:relative!important;width:100%!important;left:auto!important;top:auto!important}}

.card:hover{transform:scale(1.06);border-color:rgba(255,255,255,0.1);box-shadow:0 8px 30px rgba(0,0,0,0.4);z-index:30}
.card.active{border-color:var(--ac);box-shadow:0 0 20px var(--gw);z-index:30}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--ac);opacity:0;transition:opacity 0.25s;z-index:5}
.card:hover::after,.card.active::after{opacity:1}

.cv{height:58px;position:relative;overflow:hidden;border-bottom:1px solid var(--brd)}
.cv canvas{width:100%;height:100%;display:block}

.cb{padding:8px 10px 10px}
.ch{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.ci{font-size:13px}
.cn{font-size:11px;font-weight:700;letter-spacing:-0.2px}
.ct{margin-left:auto;padding:1px 5px;border-radius:3px;font-size:7px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;font-family:'Space Mono',monospace}
.cd{font-size:9px;color:rgba(255,255,255,0.25);line-height:1.4}
.cm{display:flex;align-items:center;gap:3px;margin-top:4px;font-size:8px;color:rgba(255,255,255,0.15);font-family:'Space Mono',monospace}
.cm .dot{width:3px;height:3px;border-radius:50%;animation:p 2s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:0.3}}

.status{position:fixed;bottom:0;left:0;right:0;height:20px;background:rgba(7,8,13,0.92);border-top:1px solid var(--brd);display:flex;align-items:center;justify-content:center;gap:14px;z-index:60;font-family:'Space Mono',monospace;font-size:8px;color:rgba(255,255,255,0.15)}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="beams"></canvas>
<nav class="topbar"><div class="brand"><em>IHE</em> Orbit</div><button>Subscribe ✦</button></nav>

<div class="universe">
    <div class="hub" id="hub">
        <h1>Navigate <em>anywhere</em></h1>
        <div class="sub">type or click a destination</div>
        <div class="bar">
            <div class="orb"><i>🧭</i></div>
            <input type="text" id="inp" placeholder="I need AI tools for grading..." autocomplete="off">
            <button class="b bm">🎙</button>
            <button class="b bs" id="go">→</button>
        </div>
        <div class="chips">
            <button class="chip" data-q="new to AI">🌱 New</button>
            <button class="chip" data-q="play news">▶ Pulse</button>
            <button class="chip" data-q="tools">🛠 Tools</button>
            <button class="chip" data-q="podcast">🎙 Pod</button>
            <button class="chip" data-q="prompts">💡 Prompts</button>
        </div>
        <div class="resp" id="resp"><div class="rbox"><p id="rT"></p><div class="acts" id="rA"></div></div></div>
    </div>
    <div class="ring" id="ring"></div>
</div>

<div class="status"><span>◉ Orbit Active</span><span>9 destinations</span></div>

<script>
const pages=[
{id:'pulse',icon:'📡',title:'Pulse',tag:'DAILY',tc:'#00e5ff',desc:'AI news daily',stat:'Today',viz:'waveform',kw:['news','pulse','daily','play','today'],resp:{t:"4 stories by Dr. Jones.",a:['▶ Play','Read']}},
{id:'podcast',icon:'🎙',title:'Podcast',tag:'WEEKLY',tc:'#c850c0',desc:'Faculty interviews',stat:'24 eps',viz:'circles',kw:['podcast','episode','listen'],resp:{t:"Latest: AI campus. 38 min.",a:['▶ Play','All']}},
{id:'tools',icon:'🛠',title:'AI Tools',tag:'50+',tc:'#00ff88',desc:'Vetted by role',stat:'52 tools',viz:'grid',kw:['tool','app','software','directory','grading'],resp:{t:"50+ AI tools for higher ed.",a:['Browse','Teaching']}},
{id:'prompts',icon:'💡',title:'Prompts',tag:'COPY',tc:'#ffd700',desc:'Ready templates',stat:'120+',viz:'text',kw:['prompt','template'],resp:{t:"Copy-paste prompts.",a:['Browse','Start']}},
{id:'tinkerlab',icon:'🔬',title:'Tinker Lab',tag:'5MIN',tc:'#ff8c42',desc:'Quick experiments',stat:'18 labs',viz:'particles',kw:['tinker','lab','experiment'],resp:{t:"5-min experiments.",a:['Latest','All']}},
{id:'guides',icon:'🌱',title:'Start Here',tag:'NEW',tc:'#14b8a6',desc:'AI basics, no jargon',stat:'Beginner',viz:'path',kw:['new','start','begin','learn','teach','faculty','help'],resp:{t:"Welcome. Let's start.",a:['Start','Quick']}},
{id:'cases',icon:'📊',title:'Cases',tag:'DATA',tc:'#a855f7',desc:'Campus outcomes',stat:'12 cases',viz:'bars',kw:['case','study','success'],resp:{t:"Real campus results.",a:['Browse','Filter']}},
{id:'community',icon:'🤝',title:'Community',tag:'JOIN',tc:'#ff6b9d',desc:'200+ educators',stat:'214',viz:'network',kw:['community','connect','forum'],resp:{t:"200+ educators together.",a:['Join','Events']}},
{id:'about',icon:'👩‍🏫',title:'About',tag:'EST.24',tc:'#f59e0b',desc:'Dr. Jones & mission',stat:'Founder',viz:'rings',kw:['about','norma','jones','guest'],resp:{t:"Dr. Jones — your guide.",a:['Bio','Mission']}},
];

const ring=document.getElementById('ring');
const cardEls=[];
pages.forEach((p,i)=>{
    const c=document.createElement('div');c.className='card';c.dataset.id=p.id;c.dataset.idx=i;
    c.style.setProperty('--ac',p.tc);c.style.setProperty('--gw',p.tc+'20');
    c.innerHTML=`<div class="cv"><canvas data-viz="${p.viz}" data-color="${p.tc}"></canvas></div><div class="cb"><div class="ch"><span class="ci">${p.icon}</span><span class="cn">${p.title}</span><span class="ct" style="background:${p.tc}15;color:${p.tc}">${p.tag}</span></div><div class="cd">${p.desc}</div><div class="cm"><span class="dot" style="background:${p.tc}"></span>${p.stat}</div></div>`;
    c.addEventListener('click',()=>selectP(p));
    ring.appendChild(c);cardEls.push(c);
});

// Two-ring layout
function layout(){
    if(window.innerWidth<=800)return;
    const u=document.querySelector('.universe').getBoundingClientRect();
    const h=document.getElementById('hub').getBoundingClientRect();
    const cx=h.left-u.left+h.width/2;
    const cy=h.top-u.top+h.height/2;

    // Inner ring: first 4, outer ring: last 5
    const inner=[0,1,2,3],outer=[4,5,6,7,8];
    const ri=Math.min(u.width*0.24,210);
    const ro=Math.min(u.width*0.42,370);

    inner.forEach((idx,i)=>{
        const a=-Math.PI/2+(i/inner.length)*Math.PI*2;
        cardEls[idx].style.left=(cx+Math.cos(a)*ri-77)+'px';
        cardEls[idx].style.top=(cy+Math.sin(a)*ri*0.85-65)+'px';
    });
    outer.forEach((idx,i)=>{
        const a=-Math.PI/2+(i/outer.length)*Math.PI*2+0.3;
        cardEls[idx].style.left=(cx+Math.cos(a)*ro-77)+'px';
        cardEls[idx].style.top=(cy+Math.sin(a)*ro*0.75-65)+'px';
    });
}

// Beams
const bc=document.getElementById('beams');const bx=bc.getContext('2d');let af=0;
function resB(){const d=devicePixelRatio||1;bc.width=innerWidth*d;bc.height=innerHeight*d;bx.scale(d,d)}
function drawB(){
    af+=0.01;bx.clearRect(0,0,innerWidth,innerHeight);
    if(innerWidth<=800){requestAnimationFrame(drawB);return}
    const h=document.getElementById('hub').getBoundingClientRect();
    const hx=h.left+h.width/2,hy=h.top+h.height/2;
    cardEls.forEach((card,i)=>{
        const cr=card.getBoundingClientRect();
        const cx=cr.left+cr.width/2,cy=cr.top+cr.height/2;
        const active=card.classList.contains('active');
        const hover=card.matches(':hover');
        const al=active?0.12:hover?0.06:0.018;
        const tc=pages[i].tc;
        const r=parseInt(tc.slice(1,3),16),g=parseInt(tc.slice(3,5),16),b=parseInt(tc.slice(5,7),16);
        bx.beginPath();bx.moveTo(cx,cy);
        const mx=(cx+hx)/2+Math.sin(af+i)*10,my=(cy+hy)/2+Math.cos(af+i)*10;
        bx.quadraticCurveTo(mx,my,hx,hy);
        bx.strokeStyle=`rgba(${r},${g},${b},${al})`;bx.lineWidth=active?1.5:0.5;bx.stroke();
        if(active||hover){
            const t=(af*2+i)%1;
            const dx=(1-t)*(1-t)*cx+2*(1-t)*t*mx+t*t*hx;
            const dy=(1-t)*(1-t)*cy+2*(1-t)*t*my+t*t*hy;
            bx.beginPath();bx.arc(dx,dy,active?2.5:1.5,0,6.28);
            bx.fillStyle=`rgba(${r},${g},${b},${active?0.5:0.25})`;bx.fill();
        }
    });
    requestAnimationFrame(drawB);
}

// Viz
function initViz(){
document.querySelectorAll('.cv canvas').forEach(cv=>{
    const dpr=devicePixelRatio||1;const r=cv.getBoundingClientRect();if(!r.width)return;
    cv.width=r.width*dpr;cv.height=r.height*dpr;
    const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
    const viz=cv.dataset.viz,color=cv.dataset.color;
    const w=r.width,h=r.height;
    const rgb={r:parseInt(color.slice(1,3),16),g:parseInt(color.slice(3,5),16),b:parseInt(color.slice(5,7),16)};
    let f=Math.random()*100;
    function draw(){
        f+=0.02;ctx.clearRect(0,0,w,h);const c=`${rgb.r},${rgb.g},${rgb.b}`;
        if(viz==='waveform'){ctx.beginPath();for(let x=0;x<w;x++){const v=Math.sin(x*.05+f*2)*10+Math.sin(x*.1+f*3)*6;x===0?ctx.moveTo(x,h/2+v):ctx.lineTo(x,h/2+v)}ctx.strokeStyle=`rgba(${c},0.4)`;ctx.lineWidth=1.5;ctx.stroke()}
        else if(viz==='circles'){for(let i=0;i<4;i++){const x=w*0.2+i*20+Math.sin(f+i)*6;const y=h/2+Math.cos(f*1.2+i)*8;ctx.beginPath();ctx.arc(x,y,10+Math.sin(f*2+i)*4,0,6.28);ctx.fillStyle=`rgba(${c},${0.04+i*0.015})`;ctx.fill();ctx.strokeStyle=`rgba(${c},0.08)`;ctx.lineWidth=0.5;ctx.stroke()}}
        else if(viz==='grid'){for(let rr=1;rr<=2;rr++)for(let cc=1;cc<=6;cc++){const p=Math.sin(f*2+rr*0.5+cc*0.3)*0.4+0.6;ctx.beginPath();ctx.arc(cc*w/7,rr*h/3,2+p*1.5,0,6.28);ctx.fillStyle=`rgba(${c},${0.1*p})`;ctx.fill()}}
        else if(viz==='text'){ctx.font='8px "Space Mono"';['> rubric','> feedback','> lesson'].forEach((l,i)=>{const s=(f*10+i*20)%(h+20)-5;const a=Math.max(0,1-Math.abs(s-h/2)/(h/2));ctx.fillStyle=`rgba(${c},${0.2*a})`;ctx.fillText(l,6,s)})}
        else if(viz==='particles'){for(let i=0;i<10;i++){const x=(Math.sin(f*0.4+i*1.5)*0.38+0.5)*w;const y=(Math.cos(f*0.55+i*1.1)*0.38+0.5)*h;ctx.beginPath();ctx.arc(x,y,1.5+Math.sin(f*2+i),0,6.28);ctx.fillStyle=`rgba(${c},${0.18+Math.sin(f+i)*0.08})`;ctx.fill()}}
        else if(viz==='path'){for(let i=0;i<4;i++){const x=8+i*(w-16)/3;const y=h/2+Math.sin(i*0.8)*8;const a=Math.sin(f*1.5-i*0.5)>0.2;ctx.beginPath();ctx.arc(x,y,a?5:3,0,6.28);ctx.fillStyle=`rgba(${c},${a?0.28:0.05})`;ctx.fill();if(i<3){const nx=8+(i+1)*(w-16)/3;const ny=h/2+Math.sin((i+1)*0.8)*8;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(nx,ny);ctx.strokeStyle=`rgba(${c},0.04)`;ctx.lineWidth=0.5;ctx.stroke()}}}
        else if(viz==='bars'){const bars=5;const bw=(w-12)/bars;for(let i=0;i<bars;i++){const bh=6+Math.sin(f*1.5+i*0.6)*6+(i/bars)*22;ctx.fillStyle=`rgba(${c},${0.06+i*0.025})`;ctx.fillRect(6+i*bw+1,h-4-bh,bw-2,bh)}}
        else if(viz==='network'){const pts=[];for(let i=0;i<8;i++)pts.push({x:(Math.sin(f*0.25+i*1.9)*0.38+0.5)*w,y:(Math.cos(f*0.35+i*1.4)*0.38+0.5)*h});pts.forEach((a,i)=>pts.forEach((b,j)=>{if(j<=i)return;const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<45){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(${c},${0.05*(1-d/45)})`;ctx.lineWidth=0.5;ctx.stroke()}}));pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,1.5,0,6.28);ctx.fillStyle=`rgba(${c},0.18)`;ctx.fill()})}
        else if(viz==='rings'){for(let i=0;i<3;i++){const rr=6+i*8+Math.sin(f+i)*2;ctx.beginPath();ctx.arc(w/2,h/2,rr,0,6.28);ctx.strokeStyle=`rgba(${c},${0.06-i*0.01})`;ctx.lineWidth=0.8;ctx.stroke()}ctx.beginPath();ctx.arc(w/2,h/2,3,0,6.28);ctx.fillStyle=`rgba(${c},0.22)`;ctx.fill()}
        requestAnimationFrame(draw);
    }draw();
});
}

function selectP(p){document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));document.querySelector(`[data-id="${p.id}"]`).classList.add('active');document.getElementById('rT').textContent=p.resp.t;document.getElementById('rA').innerHTML=p.resp.a.map(a=>`<button>${a}</button>`).join('');document.getElementById('resp').classList.add('on')}
function proc(t){if(!t.trim())return;const l=t.toLowerCase();let b=null,bs=0;pages.forEach(p=>{let s=0;p.kw.forEach(k=>{if(l.includes(k))s+=2});if(s>bs){bs=s;b=p}});if(!b)b=pages[5];selectP(b)}
document.getElementById('go').addEventListener('click',()=>{const i=document.getElementById('inp');proc(i.value);i.value=''});
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter'){proc(e.target.value);e.target.value=''}});
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>proc(c.dataset.q)));

function init(){resB();layout();setTimeout(initViz,200)}
window.addEventListener('load',init);
window.addEventListener('resize',()=>{resB();layout()});
drawB();
</script>
</body>
</html>
