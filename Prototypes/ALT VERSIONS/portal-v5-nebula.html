<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IHE Portal — The Nebula</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020208;font-family:'Space Grotesk',sans-serif;color:#fff;height:100vh;overflow:hidden}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
.topbar{position:fixed;top:0;left:0;right:0;height:48px;background:rgba(2,2,8,0.6);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.03);display:flex;align-items:center;padding:0 24px;z-index:100}
.topbar .brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.topbar .brand .dot{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#fff,#c850c0)}
.topbar .brand span{background:linear-gradient(135deg,#c8a0ff,#ff9ec8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hub{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);width:90%;max-width:540px;z-index:50}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(10,5,20,0.9);border:1px solid rgba(200,160,255,0.1);border-radius:16px;backdrop-filter:blur(20px);box-shadow:0 0 50px rgba(200,80,192,0.05)}
.bar:focus-within{border-color:rgba(200,160,255,0.25)}
.orb{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#c8a0ff,#c850c0);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 20px rgba(200,160,255,0.3);animation:nebPulse 3s ease-in-out infinite}
@keyframes nebPulse{0%,100%{box-shadow:0 0 20px rgba(200,160,255,0.3)}50%{box-shadow:0 0 35px rgba(200,160,255,0.5)}}
.bar input{flex:1;background:none;border:none;outline:none;color:#fff;font-family:inherit;font-size:14px;padding:6px}
.bar input::placeholder{color:rgba(200,160,255,0.3)}
.bar button{width:34px;height:34px;border-radius:10px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.bs{background:linear-gradient(135deg,#c8a0ff,#ff6b9d);color:#fff}
.bm{background:rgba(255,255,255,0.03);color:rgba(200,160,255,0.4);border:1px solid rgba(200,160,255,0.08)}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:8px}
.chip{padding:5px 12px;background:rgba(200,160,255,0.03);border:1px solid rgba(200,160,255,0.06);border-radius:16px;color:rgba(200,160,255,0.4);font-size:11px;cursor:pointer;font-family:inherit;transition:all 0.2s}
.chip:hover{background:rgba(200,160,255,0.08);border-color:rgba(200,160,255,0.2);color:#c8a0ff}
.resp{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);max-width:500px;width:90%;z-index:50;opacity:0;pointer-events:none;transition:opacity 0.4s}
.resp.on{opacity:1;pointer-events:auto}
.rbox{background:rgba(10,5,20,0.95);border:1px solid rgba(200,160,255,0.08);border-radius:12px;padding:14px 18px;backdrop-filter:blur(20px)}
.rbox p{font-size:13px;line-height:1.6;color:rgba(255,255,255,0.75);margin-bottom:10px}
.rbox .btns{display:flex;gap:6px;flex-wrap:wrap}
.rbox .btns button{padding:5px 12px;background:rgba(200,160,255,0.06);border:1px solid rgba(200,160,255,0.12);border-radius:7px;color:#c8a0ff;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.status{position:fixed;bottom:0;left:0;right:0;height:22px;background:rgba(2,2,8,0.8);border-top:1px solid rgba(200,160,255,0.03);display:flex;align-items:center;justify-content:center;gap:16px;z-index:60;font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(200,160,255,0.25)}
</style>
</head>
<body>
<nav class="topbar"><div class="brand"><div class="dot"></div><span>Innovating Higher Ed</span></div></nav>
<canvas id="c"></canvas>
<div class="hub">
<div class="bar"><div class="orb"></div><input type="text" id="inp" placeholder="Drift toward what you need..." autocomplete="off"><button class="bm">🎙</button><button class="bs" id="go">→</button></div>
<div class="chips"><button class="chip" data-q="new to AI">🌱 New to AI</button><button class="chip" data-q="play news">▶ Pulse</button><button class="chip" data-q="tools">🛠 Tools</button><button class="chip" data-q="podcast">🎙 Podcast</button><button class="chip" data-q="prompts">💡 Prompts</button><button class="chip" data-q="case studies">📊 Cases</button></div>
</div>
<div class="resp" id="resp"><div class="rbox"><p id="rT"></p><div class="btns" id="rB"></div></div></div>
<div class="status"><span>✦ Nebula Online</span><span>11 regions • 51 resources</span></div>

<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H,cx,cy,t=0,sel=null,hover=null;
const nodes=[
{id:'pulse',label:'Innovation Pulse',sub:'Daily Briefing',icon:'📡',color:'#00e5ff',kw:['news','pulse','daily','play','today']},
{id:'podcast',label:'Podcast',sub:'Dr. Jones',icon:'🎙',color:'#c850c0',kw:['podcast','episode','listen']},
{id:'tools',label:'AI Tools',sub:'50+ Vetted',icon:'🛠',color:'#00ff88',kw:['tool','app','software']},
{id:'prompts',label:'Prompts',sub:'Copy & Use',icon:'💡',color:'#ffd700',kw:['prompt','template']},
{id:'tinkerlab',label:'Tinker Lab',sub:'Experiments',icon:'🔬',color:'#ff8c42',kw:['tinker','lab']},
{id:'guides',label:'Getting Started',sub:'AI Basics',icon:'🌱',color:'#14b8a6',kw:['new','start','begin','learn','teach','faculty','professor','help']},
{id:'cases',label:'Case Studies',sub:'Outcomes',icon:'📊',color:'#a855f7',kw:['case','study','success']},
{id:'edtools',label:'Resources',sub:'Templates',icon:'📚',color:'#3b82f6',kw:['resource','download']},
{id:'community',label:'Community',sub:'Connect',icon:'🤝',color:'#ff6b9d',kw:['community','connect','forum']},
{id:'guests',label:'Be Our Guest',sub:'Share',icon:'✨',color:'#ef4444',kw:['guest','contribute']},
{id:'about',label:'About',sub:'Dr. Jones',icon:'👩‍🏫',color:'#f59e0b',kw:['about','norma']},
];

// Cloud particles for nebula effect
let clouds=[];
for(let i=0;i<120;i++){
    clouds.push({
        x:Math.random()*3000-500,y:Math.random()*2000-200,
        r:Math.random()*80+30,
        color:['rgba(200,80,192,','rgba(0,229,255,','rgba(100,60,180,','rgba(255,107,157,','rgba(80,40,160,'][Math.floor(Math.random()*5)],
        a:Math.random()*0.015+0.003,
        phase:Math.random()*6.28,speed:Math.random()*0.003+0.001
    });
}
const stars=Array.from({length:400},()=>({x:Math.random()*4000-500,y:Math.random()*2500-300,r:Math.random()*1.2+0.1,a:Math.random()*0.5+0.1,p:Math.random()*6.28}));
let particles=[];

function resize(){W=C.width=innerWidth;H=C.height=innerHeight;cx=W/2;cy=H/2;posN()}
function posN(){
    const r=Math.min(W*0.33,H*0.32,330);
    nodes.forEach((n,i)=>{
        const a=(i/nodes.length)*6.28-Math.PI/2;
        n.tx=cx+Math.cos(a)*r;n.ty=cy+Math.sin(a)*r;
        if(n.x===undefined){n.x=cx;n.y=cy}
    });
}
resize();addEventListener('resize',resize);
function hex(h,a){return`rgba(${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)},${a})`}
function spawnP(n){particles.push({nid:n.id,t:0,sp:0.003+Math.random()*0.004,sz:1.5+Math.random()*2,col:n.color,dir:Math.random()>0.5})}
setInterval(()=>{nodes.forEach(n=>{if(Math.random()<0.2)spawnP(n);if(n.id===sel&&Math.random()<0.5)spawnP(n)})},200);

function render(){
    t+=0.006;X.clearRect(0,0,W,H);
    // Deep space bg
    X.fillStyle='#030210';X.fillRect(0,0,W,H);

    // Nebula clouds
    clouds.forEach(c=>{
        const pulse=Math.sin(t+c.phase)*0.3+0.7;
        const g=X.createRadialGradient(c.x,c.y,0,c.x,c.y,c.r);
        g.addColorStop(0,c.color+(c.a*pulse*1.5)+')');
        g.addColorStop(0.5,c.color+(c.a*pulse*0.5)+')');
        g.addColorStop(1,c.color+'0)');
        X.beginPath();X.arc(c.x,c.y,c.r,0,6.28);X.fillStyle=g;X.fill();
    });

    // Stars
    stars.forEach(s=>{X.beginPath();X.arc(s.x,s.y,s.r,0,6.28);X.fillStyle=`rgba(220,210,255,${s.a*(Math.sin(t*2+s.p)*0.3+0.7)})`;X.fill()});

    // Center core
    const hp=Math.sin(t*1.5)*0.15+0.85;
    // Large nebula glow at center
    const cg1=X.createRadialGradient(cx,cy,0,cx,cy,120);
    cg1.addColorStop(0,`rgba(255,255,255,${0.08*hp})`);
    cg1.addColorStop(0.2,`rgba(200,160,255,${0.05*hp})`);
    cg1.addColorStop(0.5,`rgba(200,80,192,${0.02*hp})`);
    cg1.addColorStop(1,'rgba(0,0,0,0)');
    X.beginPath();X.arc(cx,cy,120,0,6.28);X.fillStyle=cg1;X.fill();
    // Inner bright core
    const cg2=X.createRadialGradient(cx,cy,0,cx,cy,20);
    cg2.addColorStop(0,`rgba(255,255,255,${0.6*hp})`);
    cg2.addColorStop(0.5,`rgba(200,160,255,${0.3*hp})`);
    cg2.addColorStop(1,'rgba(200,80,192,0)');
    X.beginPath();X.arc(cx,cy,20,0,6.28);X.fillStyle=cg2;X.fill();

    X.font='500 10px "Space Grotesk"';X.fillStyle='rgba(200,160,255,0.4)';X.textAlign='center';X.fillText('CHAT-NAV',cx,cy+36);

    // Nodes with nebula auras
    nodes.forEach((n,i)=>{
        n.x+=(n.tx-n.x)*0.05;n.y+=(n.ty-n.y)*0.05;
        const isSel=n.id===sel,isHov=n.id===hover;
        const intensity=isSel?1:isHov?0.7:0.35;
        const pulse=Math.sin(t*2+i*0.6)*0.3+0.7;

        // Wispy connection to center
        const steps=20;
        X.beginPath();
        for(let s=0;s<=steps;s++){
            const tt=s/steps;
            const px=cx+(n.x-cx)*tt+Math.sin(t*2+tt*8+i)*6*(1-tt);
            const py=cy+(n.y-cy)*tt+Math.cos(t*2+tt*8+i)*6*(1-tt);
            s===0?X.moveTo(px,py):X.lineTo(px,py);
        }
        X.strokeStyle=hex(n.color,isSel?0.2:isHov?0.12:0.03);X.lineWidth=isSel?3:isHov?2:1;X.stroke();

        // Node nebula cloud
        const nr=isSel?40:isHov?34:28;
        const ng=X.createRadialGradient(n.x,n.y,0,n.x,n.y,nr+15);
        ng.addColorStop(0,hex(n.color,0.15*intensity*pulse));
        ng.addColorStop(0.5,hex(n.color,0.06*intensity));
        ng.addColorStop(1,hex(n.color,0));
        X.beginPath();X.arc(n.x,n.y,nr+15,0,6.28);X.fillStyle=ng;X.fill();

        // Second cloud layer (offset)
        const ng2=X.createRadialGradient(n.x+5,n.y-3,0,n.x+5,n.y-3,nr+8);
        ng2.addColorStop(0,hex(n.color,0.08*intensity));ng2.addColorStop(1,hex(n.color,0));
        X.beginPath();X.arc(n.x+5,n.y-3,nr+8,0,6.28);X.fillStyle=ng2;X.fill();

        // Core
        const ccg=X.createRadialGradient(n.x,n.y,0,n.x,n.y,isSel?12:8);
        ccg.addColorStop(0,hex(n.color,0.7*intensity));ccg.addColorStop(1,hex(n.color,0));
        X.beginPath();X.arc(n.x,n.y,isSel?12:8,0,6.28);X.fillStyle=ccg;X.fill();

        // Icon
        X.font=`${isSel?22:16}px sans-serif`;X.textAlign='center';X.textBaseline='middle';X.fillText(n.icon,n.x,n.y);
        // Labels
        X.font=`${isSel?'600':'500'} ${isSel?12:11}px "Space Grotesk"`;
        X.fillStyle=isSel?'#fff':isHov?'rgba(255,255,255,0.7)':'rgba(255,255,255,0.4)';
        X.textBaseline='top';X.fillText(n.label,n.x,n.y+nr+4);
        X.font='400 9px "JetBrains Mono"';X.fillStyle=isSel?hex(n.color,0.7):'rgba(200,160,255,0.15)';
        X.fillText(n.sub,n.x,n.y+nr+18);
    });

    // Particles (flowing wisps)
    particles=particles.filter(p=>{
        p.t+=p.sp;if(p.t>1)return false;
        const n=nodes.find(x=>x.id===p.nid);if(!n)return false;
        const tt=p.dir?p.t:1-p.t;
        const px=cx+(n.x-cx)*tt+Math.sin(t*2+tt*8)*5;
        const py=cy+(n.y-cy)*tt+Math.cos(t*2+tt*8)*5;
        X.beginPath();X.arc(px,py,p.sz+3,0,6.28);X.fillStyle=hex(p.col,0.06);X.fill();
        X.beginPath();X.arc(px,py,p.sz,0,6.28);X.fillStyle=hex(p.col,0.4);X.fill();
        return true;
    });

    requestAnimationFrame(render);
}
render();

C.addEventListener('mousemove',e=>{hover=null;C.style.cursor='default';nodes.forEach(n=>{if(Math.hypot(e.clientX-n.x,e.clientY-n.y)<40){hover=n.id;C.style.cursor='pointer'}})});
C.addEventListener('click',e=>{nodes.forEach(n=>{if(Math.hypot(e.clientX-n.x,e.clientY-n.y)<40)selectN(n)})});
function selectN(n){sel=n.id;for(let i=0;i<10;i++)setTimeout(()=>spawnP(n),i*40);showR(n)}
const msgs={pulse:{t:"Morning briefing. 4 stories. Dr. Jones narrates.",a:['▶ Play','Read']},podcast:{t:"Latest episode on AI ethics in academia.",a:['▶ Play','All']},tools:{t:"50+ AI tools vetted for higher ed.",a:['Browse','Teaching']},prompts:{t:"Copy-paste prompts for educators.",a:['Browse','Beginners']},tinkerlab:{t:"5-minute experiments from the lab.",a:['Latest','All']},guides:{t:"AI fundamentals. No jargon, no panic.",a:['Start','Quick-Start']},cases:{t:"Real outcomes from real campuses.",a:['Browse','Filter']},edtools:{t:"Templates and downloads.",a:['Browse','Plans']},community:{t:"200+ educators navigating AI.",a:['Join','Events']},guests:{t:"Share your AI journey.",a:['Apply','Info']},about:{t:"Dr. Norma Jones. Innovation guide.",a:['Bio','Mission']}};
function showR(n){const m=msgs[n.id]||{t:'...',a:['Go']};document.getElementById('rT').textContent=m.t;document.getElementById('rB').innerHTML=m.a.map(a=>`<button>${a}</button>`).join('');document.getElementById('resp').classList.add('on')}
function proc(text){if(!text.trim())return;const l=text.toLowerCase();let b=null,bs=0;nodes.forEach(n=>{let s=0;n.kw.forEach(k=>{if(l.includes(k))s+=2});if(l.includes('new')||l.includes('help'))if(n.id==='guides')s+=4;if(s>bs){bs=s;b=n}});if(!b)b=nodes[5];selectN(b)}
document.getElementById('go').addEventListener('click',()=>{const i=document.getElementById('inp');proc(i.value);i.value=''});
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter'){proc(e.target.value);e.target.value=''}});
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>proc(c.dataset.q)));
</script>
</body>
</html>
