<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI App Directory — Innovating Higher Ed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080810;--surface:#0e0e1a;--card:#121220;--card-hover:#16162a;
  --border:#1c1c32;--border-light:#2a2a44;
  --text:#ededf5;--muted:#7e7e9a;--dim:#4e4e66;
  --cyan:#00d4ff;--magenta:#c850c0;--green:#2ee6a8;--amber:#ffb347;--red:#ff5c6c;
  --radius:14px;--radius-sm:8px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Outfit',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}

/* ===== NAV ===== */
.nav{position:sticky;top:0;z-index:100;background:rgba(8,8,16,.88);backdrop-filter:blur(24px) saturate(1.2);border-bottom:1px solid rgba(28,28,50,.6);padding:0 32px;height:60px;display:flex;align-items:center;gap:28px}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-brand img{height:36px}
.nav-brand span{font-weight:700;font-size:1rem;color:var(--text);letter-spacing:.3px}
.nav-links{display:flex;gap:24px;margin-left:auto}
.nav-links a{color:var(--muted);text-decoration:none;font-size:.86rem;font-weight:500;transition:color .2s;position:relative}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--cyan)}
.nav-links a.active::after{content:'';position:absolute;bottom:-19px;left:0;right:0;height:2px;background:var(--cyan)}

/* ===== HERO ===== */
.hero{padding:56px 24px 36px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:900px;height:500px;background:radial-gradient(ellipse at center,rgba(0,212,255,.05) 0%,rgba(200,80,192,.03) 40%,transparent 70%);pointer-events:none}
.hero-label{display:inline-flex;align-items:center;gap:8px;padding:5px 16px;border-radius:20px;border:1px solid rgba(0,212,255,.18);background:rgba(0,212,255,.04);color:var(--cyan);font-size:.78rem;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:18px}
.hero h1{font-size:clamp(2rem,4vw,3rem);font-weight:800;line-height:1.1;margin-bottom:14px;letter-spacing:-.02em}
.hero h1 em{font-style:normal;background:linear-gradient(135deg,var(--cyan),var(--magenta));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{color:var(--muted);font-size:1.08rem;max-width:580px;margin:0 auto 28px;font-weight:400}

/* Search */
.search-wrap{max-width:600px;margin:0 auto 20px;position:relative}
.search-wrap input{width:100%;padding:14px 20px 14px 50px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;font-size:.95rem;outline:none;transition:all .25s}
.search-wrap input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,255,.08)}
.search-wrap input::placeholder{color:var(--dim)}
.search-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}

/* Filter Pills */
.filters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 20px;margin-bottom:8px}
.pill{padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:inherit;font-size:.82rem;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
.pill:hover{border-color:rgba(0,212,255,.35);color:var(--text)}
.pill.active{background:rgba(0,212,255,.1);border-color:rgba(0,212,255,.4);color:var(--cyan)}
.pill .ct{font-family:'DM Mono',monospace;font-size:.72rem;margin-left:4px;opacity:.6}

/* Sort Bar */
.sort-bar{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:20px auto 0;padding:0 24px}
.sort-pills{display:flex;gap:6px}
.sort-pill{padding:5px 14px;border-radius:var(--radius-sm);border:1px solid transparent;background:transparent;color:var(--dim);font-family:inherit;font-size:.8rem;font-weight:500;cursor:pointer;transition:all .2s}
.sort-pill:hover{color:var(--muted)}
.sort-pill.active{background:var(--surface);border-color:var(--border);color:var(--text)}
.result-count{font-size:.84rem;color:var(--dim);font-family:'DM Mono',monospace}

/* ===== MAIN ===== */
.main{max-width:1200px;margin:24px auto 0;padding:0 24px 80px}

/* ===== TOOL CARDS ===== */
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:18px}

.tool-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .35s ease;cursor:pointer;position:relative}
.tool-card:hover{border-color:var(--tool-accent,var(--border-light));transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.35)}

/* Brand accent strip at top */
.tool-accent{height:3px;background:var(--tool-accent,var(--border));transition:height .3s}
.tool-card:hover .tool-accent{height:4px}

.tool-body{padding:20px 22px 18px}

/* Top row: logo + name + badges */
.tool-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.tool-logo{width:46px;height:46px;border-radius:12px;overflow:hidden;flex-shrink:0;background:var(--surface);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);position:relative}
.tool-logo img{width:32px;height:32px;object-fit:contain}
.tool-logo.fallback{font-size:1.1rem;font-weight:700;color:var(--tool-accent,var(--cyan))}
.tool-info{flex:1;min-width:0}
.tool-name{font-size:1.12rem;font-weight:700;letter-spacing:-.01em}
.tool-cat{font-size:.76rem;color:var(--muted);font-weight:500;margin-top:1px}
.tool-badges{display:flex;gap:5px;flex-shrink:0}
.badge{padding:3px 9px;border-radius:4px;font-size:.68rem;font-weight:600;letter-spacing:.4px;text-transform:uppercase;font-family:'DM Mono',monospace}
.badge-new{background:rgba(46,230,168,.1);color:var(--green);border:1px solid rgba(46,230,168,.2)}
.badge-trending{background:rgba(255,179,71,.1);color:var(--amber);border:1px solid rgba(255,179,71,.2)}
.badge-updated{background:rgba(0,212,255,.08);color:var(--cyan);border:1px solid rgba(0,212,255,.18)}

/* Description */
.tool-desc{font-size:.9rem;color:var(--muted);line-height:1.55;margin-bottom:14px}

/* 3 Value Points */
.tool-values{list-style:none;margin-bottom:16px;display:flex;flex-direction:column;gap:7px}
.tool-values li{font-size:.84rem;color:var(--text);padding-left:20px;position:relative;line-height:1.45}
.tool-values li::before{content:'';position:absolute;left:0;top:7px;width:8px;height:8px;border-radius:2px;background:var(--tool-accent,var(--cyan));opacity:.7}

/* Footer: pricing + roles + learn more */
.tool-footer{display:flex;align-items:center;gap:10px;padding-top:14px;border-top:1px solid var(--border);flex-wrap:wrap}
.pricing-tag{padding:4px 11px;border-radius:6px;font-size:.76rem;font-weight:600;font-family:'DM Mono',monospace}
.price-free{background:rgba(46,230,168,.08);color:var(--green);border:1px solid rgba(46,230,168,.15)}
.price-freemium{background:rgba(0,212,255,.07);color:var(--cyan);border:1px solid rgba(0,212,255,.15)}
.price-paid{background:rgba(255,179,71,.07);color:var(--amber);border:1px solid rgba(255,179,71,.15)}
.role-tags{display:flex;gap:5px;flex:1}
.role-tag{padding:2px 8px;border-radius:4px;font-size:.7rem;color:var(--dim);background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}
.learn-more{margin-left:auto;color:var(--tool-accent,var(--cyan));font-size:.84rem;font-weight:600;display:flex;align-items:center;gap:4px;transition:gap .2s}
.tool-card:hover .learn-more{gap:8px}

/* ===== DETAIL PANEL ===== */
.detail-overlay{position:fixed;inset:0;background:rgba(4,4,10,.75);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
.detail-overlay.open{display:flex}
.detail-panel{background:var(--card);border:1px solid var(--border-light);border-radius:18px;max-width:720px;width:100%;max-height:85vh;overflow-y:auto;position:relative}
.detail-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:5}
.detail-close:hover{border-color:var(--red);color:var(--red)}
.detail-accent{height:4px;border-radius:18px 18px 0 0}
.detail-header{padding:28px 32px 20px;display:flex;gap:18px;align-items:flex-start}
.detail-logo{width:64px;height:64px;border-radius:16px;overflow:hidden;background:var(--surface);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);flex-shrink:0}
.detail-logo img{width:44px;height:44px;object-fit:contain}
.detail-title h2{font-size:1.5rem;font-weight:700;margin-bottom:4px}
.detail-title .detail-cat{font-size:.84rem;color:var(--muted)}
.detail-badges{display:flex;gap:6px;margin-top:8px}
.detail-content{padding:0 32px 32px}
.detail-section{margin-bottom:24px}
.detail-section h3{font-size:.82rem;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--tool-accent,var(--cyan));margin-bottom:10px}
.detail-section p{font-size:.94rem;color:var(--muted);line-height:1.7}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.detail-box{padding:16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface)}
.detail-box h4{font-size:.88rem;font-weight:600;margin-bottom:6px}
.detail-box ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.detail-box li{font-size:.86rem;color:var(--muted);padding-left:16px;position:relative}
.detail-box li::before{content:'';position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%}
.detail-box.strengths li::before{background:var(--green)}
.detail-box.limitations li::before{background:var(--amber)}
.detail-pricing-breakdown{padding:16px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);margin-bottom:24px}
.detail-pricing-breakdown h4{font-size:.88rem;font-weight:600;margin-bottom:8px}
.detail-pricing-breakdown p{font-size:.88rem;color:var(--muted);line-height:1.6}
.detail-quickstart{padding:18px;border-radius:var(--radius-sm);background:linear-gradient(135deg,rgba(0,212,255,.04),rgba(200,80,192,.03));border:1px solid rgba(0,212,255,.12);margin-bottom:24px}
.detail-quickstart h4{font-size:.88rem;font-weight:600;color:var(--cyan);margin-bottom:6px}
.detail-quickstart p{font-size:.88rem;color:var(--muted);line-height:1.6}
.detail-visit{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:var(--radius-sm);background:var(--tool-accent,var(--cyan));color:#080810;font-weight:600;font-size:.9rem;text-decoration:none;transition:all .2s}
.detail-visit:hover{opacity:.9;transform:translateY(-1px)}

/* ===== RESPONSIVE ===== */
@media(max-width:800px){
  .tool-grid{grid-template-columns:1fr}
  .nav-links{display:none}
  .detail-grid{grid-template-columns:1fr}
  .detail-header{flex-direction:column}
  .hero h1{font-size:2rem}
}
@media(max-width:480px){
  .tool-grid{grid-template-columns:1fr}
  .filters{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;padding-bottom:8px}
}
</style>
</head>

const CATEGORIES = [...new Set(TOOLS.map(t=>t.cat))];
let activeRole = 'all', activeCat = 'all', activeSort = 'all', searchQ = '';

// ===== RENDER =====
function buildCatFilters(){
  const wrap = document.getElementById('catFilters');
  wrap.innerHTML = `<button class="pill active" data-cat="all">All Categories <span class="ct">${TOOLS.length}</span></button>` +
    CATEGORIES.map(c => {
      const count = TOOLS.filter(t=>t.cat===c).length;
      return `<button class="pill" data-cat="${c}">${c} <span class="ct">${count}</span></button>`;
    }).join('');
  wrap.querySelectorAll('.pill').forEach(p => p.addEventListener('click', ()=>{
    wrap.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
    p.classList.add('active');
    activeCat = p.dataset.cat;
    render();
  }));
}

function getFiltered(){
  return TOOLS.filter(t => {
    if (activeRole !== 'all' && !t.roles.includes(activeRole)) return false;
    if (activeCat !== 'all' && t.cat !== activeCat) return false;
    if (activeSort === 'new' && t.badge !== 'new') return false;
    if (activeSort === 'trending' && t.badge !== 'trending') return false;
    if (activeSort === 'updated' && t.badge !== 'updated') return false;
    if (searchQ) {
      const q = searchQ.toLowerCase();
      if (!t.name.toLowerCase().includes(q) && !t.desc.toLowerCase().includes(q) && !t.cat.toLowerCase().includes(q) && !t.values.some(v=>v.toLowerCase().includes(q))) return false;
    }
    return true;
  });
}

function toolCard(t){
  const pCls = t.pricing==='free'?'price-free':t.pricing==='freemium'?'price-freemium':'price-paid';
  const badgeHTML = t.badge ? `<span class="badge badge-${t.badge}">${t.badge}</span>` : '';
  return `<div class="tool-card" style="--tool-accent:${t.accent}" onclick="openDetail('${t.id}')">
    <div class="tool-accent" style="background:${t.accent}"></div>
    <div class="tool-body">
      <div class="tool-top">
        <div class="tool-logo"><img src="https://www.google.com/s2/favicons?domain=${t.domain}&sz=64" alt="${t.name}" onerror="this.parentElement.classList.add('fallback');this.parentElement.innerHTML='${t.name[0]}'"></div>
        <div class="tool-info">
          <div class="tool-name">${t.name}</div>
          <div class="tool-cat">${t.cat}</div>
        </div>
        <div class="tool-badges">${badgeHTML}</div>
      </div>
      <div class="tool-desc">${t.desc}</div>
      <ul class="tool-values">${t.values.map(v=>`<li>${v}</li>`).join('')}</ul>
      <div class="tool-footer">
        <span class="pricing-tag ${pCls}">${t.pricing}</span>
        <div class="role-tags">${t.roles.map(r=>`<span class="role-tag">${r[0].toUpperCase()+r.slice(1)}</span>`).join('')}</div>
        <span class="learn-more">Learn More <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg></span>
      </div>
    </div>
  </div>`;
}

function render(){
  const filtered = getFiltered();
  const grid = document.getElementById('toolGrid');
  grid.innerHTML = filtered.map(toolCard).join('');
  document.getElementById('resultCount').textContent = `${filtered.length} tool${filtered.length!==1?'s':''}`;
}

// ===== DETAIL PANEL =====
function openDetail(id){
  const t = TOOLS.find(x=>x.id===id);
  if(!t) return;
  const overlay = document.getElementById('detailOverlay');
  const panel = document.getElementById('detailPanel');
  const badgeHTML = t.badge ? `<span class="badge badge-${t.badge}">${t.badge}</span>` : '';
  const pCls = t.pricing==='free'?'price-free':t.pricing==='freemium'?'price-freemium':'price-paid';
  
  let detailHTML = `
    <button class="detail-close" onclick="closeDetail()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <div class="detail-accent" style="background:${t.accent}"></div>
    <div class="detail-header">
      <div class="detail-logo" style="border-color:${t.accent}30"><img src="https://www.google.com/s2/favicons?domain=${t.domain}&sz=128" alt="${t.name}"></div>
      <div class="detail-title">
        <h2>${t.name}</h2>
        <div class="detail-cat">${t.cat}</div>
        <div class="detail-badges">${badgeHTML} <span class="pricing-tag ${pCls}">${t.pricing}</span></div>
      </div>
    </div>
    <div class="detail-content">
      <div class="detail-section">
        <h3>What It Does</h3>
        <p>${t.desc}</p>
      </div>
      <div class="detail-section">
        <h3>Why It Matters for Higher Ed</h3>
        <ul style="list-style:none;display:flex;flex-direction:column;gap:8px">${t.values.map(v=>`<li style="padding-left:18px;position:relative;font-size:.92rem;color:var(--muted)"><span style="position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:2px;background:${t.accent};opacity:.7"></span>${v}</li>`).join('')}</ul>
      </div>`;

  if(t.bestFor){
    detailHTML += `
      <div class="detail-section">
        <h3>Best For</h3>
        <p>${t.bestFor}</p>
      </div>
      <div class="detail-grid">
        <div class="detail-box strengths">
          <h4 style="color:var(--green)">What It Does Well</h4>
          <ul>${t.strengths.map(s=>`<li>${s}</li>`).join('')}</ul>
        </div>
        <div class="detail-box limitations">
          <h4 style="color:var(--amber)">Where It Falls Short</h4>
          <ul>${t.limitations.map(l=>`<li>${l}</li>`).join('')}</ul>
        </div>
      </div>
      <div class="detail-pricing-breakdown">
        <h4>Pricing Breakdown</h4>
        <p>${t.priceDetail}</p>
      </div>
      <div class="detail-quickstart">
        <h4>Getting Started</h4>
        <p>${t.quickstart}</p>
      </div>`;
  } else {
    detailHTML += `
      <div class="detail-pricing-breakdown">
        <h4>Pricing</h4>
        <p>${t.priceDetail}</p>
      </div>
      <div class="detail-quickstart" style="background:var(--surface);border-color:var(--border)">
        <h4 style="color:var(--muted)">Full Review Coming Soon</h4>
        <p>Our editorial team is preparing an in-depth review of ${t.name} with strengths, limitations, and getting-started guidance for higher ed use.</p>
      </div>`;
  }

  detailHTML += `<a class="detail-visit" href="${t.url}" target="_blank" style="background:${t.accent}">Visit ${t.name} <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>
    </div>`;

  panel.innerHTML = detailHTML;
  panel.style.setProperty('--tool-accent', t.accent);
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail(){
  document.getElementById('detailOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('detailOverlay').addEventListener('click', e => { if(e.target === e.currentTarget) closeDetail(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeDetail(); });

// ===== EVENT LISTENERS =====
document.querySelectorAll('#roleFilters .pill').forEach(p => p.addEventListener('click', ()=>{
  document.querySelectorAll('#roleFilters .pill').forEach(b=>b.classList.remove('active'));
  p.classList.add('active');
  activeRole = p.dataset.role;
  render();
}));

document.querySelectorAll('.sort-pill').forEach(p => p.addEventListener('click', ()=>{
  document.querySelectorAll('.sort-pill').forEach(b=>b.classList.remove('active'));
  p.classList.add('active');
  activeSort = p.dataset.sort;
  render();
}));

document.getElementById('searchInput').addEventListener('input', e => {
  searchQ = e.target.value.trim();
  render();
});

// ===== INIT =====
buildCatFilters();
render();
</script>
