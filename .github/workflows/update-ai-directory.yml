name: Validate AI Directory

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-directory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      BASE_REVISION: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Check out proposed revision without stored credentials
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'

      - name: Verify pinned Node.js major
        run: node -e "if (process.versions.node.split('.')[0] !== '20') process.exit(1)"

      - name: Install locked validation dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Bind candidate bytes and Pacific validation date
        id: bind
        run: node -e "const fs=require('fs'),c=require('crypto');const b=fs.readFileSync('public/data/ai-apps.json');const h=c.createHash('sha256').update(b).digest('hex');const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const v=Object.fromEntries(p.map(x=>[x.type,x.value]));const d=v.year+'-'+v.month+'-'+v.day;fs.appendFileSync(process.env.GITHUB_OUTPUT,'sha256='+h+'\nas_of='+d+'\n')"

      - name: Check maintenance harness syntax
        run: node --check scripts/update-ai-directory.mjs

      - name: Run provider-boundary and directory schema/UI tests
        run: node --loader ./scripts/update-ai-directory.mjs --test test/ai-directory-provider-boundary.test.mjs test/ai-directory/ai-directory-schema.test.ts

      - name: Scan active provider scope
        run: node scripts/update-ai-directory.mjs scan --repo-root . --expected-head "$EXPECTED_HEAD" --allowed-dirty-paths '[]'

      - name: Validate schema independently
        run: node scripts/update-ai-directory.mjs schema --repo-root . --expected-head "$EXPECTED_HEAD" --allowed-dirty-paths '[]' --input public/data/ai-apps.json --expected-input-sha256 "${{ steps.bind.outputs.sha256 }}" --as-of "${{ steps.bind.outputs.as_of }}"

      - name: Validate source evidence independently
        run: node scripts/update-ai-directory.mjs evidence --repo-root . --expected-head "$EXPECTED_HEAD" --allowed-dirty-paths '[]' --input public/data/ai-apps.json --expected-input-sha256 "${{ steps.bind.outputs.sha256 }}" --as-of "${{ steps.bind.outputs.as_of }}"

      - name: Validate freshness independently
        run: node scripts/update-ai-directory.mjs staleness --repo-root . --expected-head "$EXPECTED_HEAD" --allowed-dirty-paths '[]' --input public/data/ai-apps.json --expected-input-sha256 "${{ steps.bind.outputs.sha256 }}" --as-of "${{ steps.bind.outputs.as_of }}" --base-revision "$BASE_REVISION"

      - name: Validate delta independently
        run: |
          approval_args=()
          if ! git diff --quiet "$BASE_REVISION" "$EXPECTED_HEAD" -- public/data/ai-apps.json && test -f data/ai-directory-approved-delta.json; then
            approval_hash="$(node -e "const fs=require('fs'),c=require('crypto');process.stdout.write(c.createHash('sha256').update(fs.readFileSync('data/ai-directory-approved-delta.json')).digest('hex'))")"
            approval_args=(--approved-delta data/ai-directory-approved-delta.json --expected-approved-delta-sha256 "$approval_hash")
          fi
          node scripts/update-ai-directory.mjs delta --repo-root . --expected-head "$EXPECTED_HEAD" --allowed-dirty-paths '[]' --input public/data/ai-apps.json --expected-input-sha256 "${{ steps.bind.outputs.sha256 }}" --as-of "${{ steps.bind.outputs.as_of }}" --base-revision "$BASE_REVISION" "${approval_args[@]}"

      - name: Lint the maintenance and active directory scope
        run: npx eslint scripts/update-ai-directory.mjs test/ai-directory-provider-boundary.test.mjs lib/data/ai-directory-schema.ts test/ai-directory/ai-directory-schema.test.ts test/ai-directory/fixtures.ts app/ai-directory/page.tsx 'app/ai-directory/[slug]/page.tsx' app/ai-directory/layout.tsx

      - name: Validate design tokens in the active frontend scope
        run: node scripts/lint-design-tokens.js

      - name: Run supported TypeScript validation including TypeScript test imports
        run: npx tsc --noEmit --allowImportingTsExtensions

      - name: Check patch whitespace
        run: git diff --check "$BASE_REVISION" "$EXPECTED_HEAD" --

      - name: Build the deterministic production bundle
        run: npx next build --webpack
